.iv-unit>span{flex-shrink:0;border-left:1px solid #e7eaf1;color:#98a2b3;font-size:12px;font-weight:400;padding:0 11px}
.m2-dialog .iv-check{display:flex;align-items:center;gap:8px;border:1px solid #e1e5ed;border-radius:8px;min-height:45px;padding:10px 12px;color:#626c7e;font-size:13px;margin-top:15px}

.iv-summary{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:45px;border:1px solid #e1e5ed;border-radius:8px;padding:10px 12px;margin-top:15px;font-size:13px;color:#626c7e;position:relative;cursor:pointer}

.iv-summary>i:after{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:white;transition:transform .15s}

function mobileLibrary(){return `<section class="dcm-home" aria-label="移动云文档"><header class="dcm-header">${mobileScope==='trash'?'<button class="dcm-back" data-dcm-scope="recent" aria-label="返回云文档">‹</button>':''}<h1>${mobileScope==='trash'?'回收站':'云文档'}</h1>${mobileScope==='trash'?'':`<button class="dcm-header-trash" data-dc-action="mobile-trash">${svg('trash')}回收站</button>`}<button class="dcm-header-refresh" data-dc-action="refresh" aria-label="刷新云文档">↻<span>刷新</span></button></header>${mobileScope==='trash'?'':`<section class="dl-quick-create" aria-label="新建文件"><button data-dc-create="doc"><span class="dl-quick-icon dl-blue">${svg('file')}</span><strong>新建文档</strong></button><button data-dc-create="sheet"><span class="dl-quick-icon dl-green">${svg('sheet')}</span><strong>新建表格</strong></button><button data-dc-action="mobile-templates"><span class="dl-quick-icon dl-purple">${svg('template')}</span><strong>从模板中选择</strong></button></section>`}<nav class="dcm-nav" aria-label="文档范围">${[['recent','全部'],['me','我创建的'],['shared','共享给我的']].map(([id,label])=>`<button data-dcm-scope="${id}" class="${mobileScope===id?'active':''}" aria-pressed="${mobileScope===id}">${label}</button>`).join('')}</nav><div class="dl-search-tools"><div class="dcm-search-row" id="dcm-search-row"><label>${svg('search')}<input id="dcm-search" value="${esc(mobileQuery)}" placeholder="搜索文档名称" aria-label="搜索文档名称"><button data-dc-action="mobile-clearsearch" aria-label="清空搜索" ${mobileQuery?'':'hidden'}>×</button></label></div><label class="dl-time-filter">${svg('clock')}<select id="dcm-time" aria-label="按更新时间筛选">${[['all','全部时间'],['7','最近7天'],['30','最近30天']].map(([v,label])=>`<option value="${v}" ${mobileTime===v?'selected':''}>${label}</option>`).join('')}</select></label></div><span id="dcm-result-label" class="dl-sr-only" aria-live="polite"></span><div class="dcm-active-filters" id="dcm-active-filters"></div><div class="dcm-file-scroll"><div id="dcm-files"></div><p class="dcm-storage">${storageOK?'内容自动 function mobileFiles(){return files.filter(f=>Boolean(f.deleted)===(mobileScope==='trash')).filter(f=>mobileScope!=='me'||f.owner==='me').filter(f=>mobileScope!=='shared'||f.owner!=='me').filter(f=>mobileScope!=='star'||f.star).filter(f=>mobileKind==='all'||f.kind===mobileKind).filter(f=>f.name.toLowerCase().includes(mobileQuery.trim().toLowerCase())).filter(f=>mobileTime==='all'||f.updated>=now()-Number(mobileTime)*86400000).sort((a,b)=>(b.opened||b.updated)-(a.opened||a.updated));}
function mobileGroup(stamp){const today=new Date();today.setHours(0,0,0,0);const yesterday=new Date(today);yesterday.setDate(yesterday.getDate()-1);return stamp>=today.getTime()?'今天':stamp>=yesterday.getTime()?'昨天':'更早';}
function mobileStamp(stamp){const d=new Date(stamp);const group=mobileGroup(stamp);const time=d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});return group==='今天'?time:group==='昨天'?'昨天 '+time:`${d.getMonth()+1}/${d.getDate()} ${time}`;}
function drawMobileRows(){const target=root.querySelector('#dcm-files');if(!target)return;const list=mobileFiles();let group='';target.innerHTML=list.map(f=>{const stamp=f.opened||f.updated,g=mobileGroup(stamp),heading=g!==group?`<div class="dcm-group">${g}</div>`:'';group=g;return `${heading}<article class="dcm-file-row">${f.deleted?`<div class="dcm-open dcm-deleted">${docIcon(f)}<span class="dcm-file-text"><strong>${esc(f.name)}</strong><small>${f.owner==='me'?'我创建的':esc(f.owner)+'共享'}<i>·</i>${mobileStamp(stamp)}</small></span></div><button class="dcm-restore" data-dc-restore="${esc(f.id)}">恢复</button>`:`<button class="dcm-open" data-dc-open="${esc(f.id)}">${docIcon(f)}<span class="dcm-file-text"><span class="dl-file-title"><strong>${esc(f.name)}${f.star?'<b class="dcm-star">★</b>':''}</strong><time>${mobileStamp(stamp)}</time></span><small><em>${f.kind==='sheet'?'表格':'文档'}</em><em class="dl-owner">${f.owner==='me'?'我创建的':'共享给我的'}</em>${f.permission==='view'?'<em>仅查看</em>':''}</small></span></button><button class="dcm-row-more" data-dc-more="${esc(f.id)}" aria-label="${esc(f.name)}的更多操作">···</button>`}</article>`;}).join('');if(!list.length)target.innerHTML=`<div class="dcm-empty"><span>${svg(mobileScope==='trash'?'trash':'file')}</span><h3>${mobileQuery?'没有找到相关文档':mobileScope==='trash'?'回收站为空':mobileKind!=='all'||mobileTime!=='all'?'没有符合筛选条件的文档':mobileScope==='star'?'还没有收藏的文档':mobileScope==='shared'?'暂无共享给你的文档':'还没有文档'}</h3><p>${mobileQuery?'试试其他名称，或清空搜索内容。':mobileScope==='trash'?'删除的文件会显示在这里。':mobileScope==='star'?'在文件的更多菜单中选择“添加收藏”。':'新建文档或调整筛选条件，继续查找。'}</p>${mobileQuery?'<button data-dc-action="mobile-clearsearch">清空搜索</button>':mobileKind!=='all'||mobileTime!=='all'?'<button data-dc-action="mobile-resetfilters">重置筛选</button>':!['trash','star','shared'].includes(mobileScope)?'<button data-dc-action="mobile-new">＋ 新建文档</button>':''}</div>`;root.querySelector('#dcm-result-label').textContent=`${({recent:'最近访问',me:'我创建的',shared:'共享给我',star:'我的收藏',trash:'回收站'})[mobileScope]} · ${list.length}`;root.querySelector('#dcm-active-filters').innerHTML=(mobileKind!=='all'?`<button data-dc-action="mobile-resetkind">${mobileKind==='doc'?'文档':'表格'} ×</button>`:'')+(mobileTime!=='all'?`<button data-dc-action="mobile-resettime">最近${mobileTime}天 ×</button>`:'');const clear=root.querySelector('.dcm-search-row [data-dc-action="mobile-clearsearch"]');if(clear)clear.hidden=!mobileQuery;root.querySelectorAll('[data-dcm-scope]').forEach(b=>{b.classList.toggle('active',b.dataset.dcmScope===mobileScope);b.setAttribute('aria-pressed',String(b.dataset.dcmScope===mobileScope));});const filterBtn=root.querySelector('.dcm-filterbutton');filterBtn?.classList.toggle('filtered',mobileKind!=='all'||mobileTime!=='all');}
function mobileNew(){const d=modal('新建',`<p class="dcm-sheet-description">从一个想法，开始新的协作。</p><div class="dcm-create-options">${templates.map(([id,icon,title,description,color])=>`<button type="button" data-dc-create="${id}"><span class="dc-templateicon ${color}">${svg(icon)}</span><span><strong>${title.replace('新建空白','').replace('新建','')}</strong><small>${description}</small></span><i>›</i></button>`).join('')}</div>`,'<button value="cancel" class="dc-btn">取消</button>');d.classList.add('dcm-sheet-dialog');}
function mobileFilter(){const d=modal('筛选文档',`<fieldset class="dcm-filter-group"><legend>文件类型</legend><div>${[['all','全部类型'],['doc','文档'],['sheet','表格']].map(([v,label])=>`<label><input name="dcm-kind" type="radio" value="${v}" ${mobileKind===v?'checked':''}><span>${label}</span></label>`).join('')}</div></fieldset><fieldset class="dcm-filter-group"><legend>更新时间</legend><div>${[['all','全部时间'],['7','最近7天'],['30','最近30天']].map(([v,label])=>`<label><input name="dcm-time" type="radio" value="${v}" ${mobileTime===v?'checked':''}><span>${label}</span></label>`).join('')}</div></fieldset>`, '<button type="button" class="dc-btn" data-dc-action="mobile-filter-clear">重置</button><button value="ok" class="dc-btn primary">查看结果</button>',d=>{mobileKind=d.querySelector('[name="dcm-kind"]:checked').value;mobileTime=d.querySelector('[name="dcm-time"]:checked').value;drawMobileRows();});d.classList.add('dcm-sheet-dialog');}
function mobileListAction(name){switch(name){case'mobile-new':mobileNew();break;case'mobile-templates':{const d=modal('选择模板',`<div class="dcm-create-options">${templates.filter(([id])=>!['doc','sheet'].includes(id)).map(([id,icon,title,description,color])=>`<button type="button" data-dc-create="${id}"><span class="dc-templateicon ${color}">${svg(icon)}</span><span><strong>${title}</strong><small>${description}</small></span><i>›</i></button>`).join('')}</div>`,'<button value="cancel" class="dc-btn">取消</button>');d.classList.add('dcm-sheet-dialog');break;}case'mobile-search':mobileSearchOpen=true;root.querySelector('#dcm-search-row').hidden=false;root.querySelector('#dcm-search').focus();break;case'mobile-search-close':mobileSearchOpen=false;mobileQuery='';root.querySelector('#dcm-search-row').hidden=true;root.querySelector('#dcm-search').value='';drawMobileRows();break;case'mobile-clearsearch':mobileQuery='';root.querySelector('#dcm-search').value='';drawMobileRows();root.querySelector('#dcm-search').focus();break;case'mobile-filter':mobileFilter();break;case'mobile-filter-clear':{const d=document.querySelector('.dc-dialog');d.querySelector('[name="dcm-kind"][value="all"]').checked=true;d.querySelector('[name="dcm-time"][value="all"]').checked=true;break;}case'mobile-resetkind':mobileKind='all';drawMobileRows();break;case'mobile-resettime':mobileTime='all';drawMobileRows();break;case'mobile-resetfilters':mobileKind=mobileTime='all';drawMobileRows();break;case'mobile-library-menu':menu(root.querySelector('.dcm-library-more'),[['mobile-trash','回收站'],['refresh','刷新文档列表']]);break;case'mobile-trash':mobileScope='trash';mobileKind=mobileTime='all';mobileQuery='';listView();break;case'mobile-settings':location.hash='workspace';setTimeout(()=>document.querySelector('[data-mobile-page="settings"]')?.click(),0);break;}}

function listView(){active=null;root.innerHTML=`<div class="dc-app dc-library">${rail()}${side()}<main class="dc-main"><div class="dc-topline"><div><h1>云文档</h1><p>让想法落在纸上，让协作有迹可循。</p></div><span class="dc-today">${new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'})}</span><button class="dc-btn dc-iconbutton" data-dc-action="refresh" title="刷新列表">↻</button></div><section class="dc-templategrid" aria-label="新建文件">${templates.map(([id,ic,name,desc,color])=>`<button data-dc-create="${id}"><span class="dc-templateicon ${color}">${svg(ic)}</span><strong>${name}</strong><small>${desc}</small><i>↗</i></button>`).join('')}</section><div class="dc-mobile-filters">${[['all','全部'],['doc','文档'],['sheet','表格'],['star','收藏'],['trash','回收站']].map(([id,label])=>`<button data-dc-filter="${id}" class="${filter===id?'active':''}" >${label}</button>`).join('')}</div><section class="dc-space"><div class="dc-space-head"><h2>${filter==='trash'?'回收站':filter==='star'?'我的收藏':'文档空间'}</h2><div class="dc-list-tools"><label class="dc-search">${svg('search')}<input id="dc-search" placeholder="搜索文档名称" value="${esc(query)}" aria-label="搜索文档名称"><kbd>/</kbd></label><select id="dc-time" aria-label="更新时间"><option value="all">全部时间</option><option value="7">最近7天</option><option value="30">最近30天</option></select></div></div><div class="dc-tabs">${[['all','全部'],['me','我创建的'],['shared','共享给我']].map(([v,label])=>`<button data-dc-tab="${v}" class="${tab===v?'active':''}">${label}</button>`).join('')}<span id="dc-count"></span></div><div class="dc-table-scroll"><table class="dc-filetable"><thead><tr><th>名称</th><th>类型</th><th>来源</th><th>权限</th><th><button data-dc-action="sort">更新时间 ${sortDesc?'↓':'↑'}</button></th><th>操作</th></tr></thead><tbody id="dc-files"></tbody></table><div id="dc-empty" hidden></div></div></section><div class="dc-list-foot">本地演示空间 · 支持编辑、自动保存与导出${storageOK?'':' · 当前无法保存，请导出备份'}</div></main>${mobileLibrary()}</div>`;root.querySelector('#dc-time').value=time;drawRows();}
function drawRows(){const list=files.filter(f=>Boolean(f.deleted)===(filter==='trash')).filter(f=>!['doc','sheet'].includes(filter)||f.kind===filter).filter(f=>filter!=='star'||f.star).filter(f=>tab==='all'||(tab==='me'?f.owner==='me':f.owner!=='me')).filter(f=>f.name.toLowerCase().includes(query.toLowerCase())).filter(f=>time==='all'||f.updated>=now()-Number(time)*86400000).sort((a,b)=>(sortDesc?-1:1)*(a.updated-b.updated));const body=root.querySelector('#dc-files');if(!body)return;body.innerHTML=list.map(f=>`<tr><td><button class="dc-openfile" data-dc-open="${esc(f.id)}">${docIcon(f)}<span>${esc(f.name)}</span>${f.star?'<i class="dc-starred">★</i>':''}</button></td><td>${f.kind==='doc'?'文档':'表格'}</td><td>${f.owner==='me'?'我创建的':'共享给我'}</td><td><span class="dc-permission ${f.permission==='view'?'view':''}">${f.permission==='edit'?'可编辑':'仅查看'}</span></td><td>${date(f.updated)}</td><td><div class="dc-row-actions">${f.deleted?`<button data-dc-restore="${esc(f.id)}">恢复</button>`:`<button data-dc-share="${esc(f.id)}">分享</button><button data-dc-more="${esc(f.id)}" aria-label="${esc(f.name)}的更多操作">···</button>`}</div></td></tr>`).join('');root.querySelector('#dc-count').textContent=`${list.length} 个文件`;const empty=root.querySelector('#dc-empty');empty.hidden=list.length>0;empty.innerHTML=`<span>${svg(filter==='trash'?'trash':'search')}</span><h3>${query?'没有匹配的文档':filter==='trash'?'回收站为空':'这里还没有文档'}</h3><p>${query?'试试其他名称，或清空搜索条件。':'新建一份文档或表格，开始记录与协作。'}</p>${query?'<button class="dc-btn" data-dc-action="clearsearch">清空搜索</button>':filter!=='trash'?'<button class="dc-btn primary" data-dc-create="doc">新建文档</button>':''}`;drawMobileRows();}
function create(kind){let f;if(kind==='meeting')f=makeFile('doc','会议纪要','<h1>会议纪要</h1><p>会议时间：</p><p>参会人员：</p><h2>会议议题</h2><p>在此填写本次讨论的主题。</p><h2>讨论结论</h2><p><br></p><h2>后续行动</h2><ul><li>事项 / 负责人 / 截止时间</li></ul>');else if(kind==='project')f=makeFile('doc','项目计划','<h1>项目计划</h1><h2>项目目标</h2><p>描述希望达成的成果。</p><h2>里程碑</h2><ol><li>需求确认</li><li>方案评审</li><li>交付验收</li></ol><h2>风险与依赖</h2><p><br></p>');else if(kind==='schedule'||kind==='team'){f=C.copy(files.find(x=>x.name===(kind==='schedule'?'版本排期':'成员分工')&&x.kind==='sheet')||makeFile('sheet','新表格'));f.id=uid();f.name=kind==='schedule'?'版本排期':'成员分工';f.owner='me';f.permission='edit';f.deleted=false;f.versions=[];f.comments=[];f.share={access:'restricted',role:'view',people:[]};f.created=f.updated=now();}else f=makeFile(kind,kind==='doc'?'无标题文档':'无标题表格',kind==='doc'?'<p><br></p>':null);files.unshift(f);persist();navigate(f.id);}
function safeBody(html){const t=document.createElement('template');t.innerHTML=String(html||'');const allowed=new Set(['H5','H6','A','PRE','CODE','IMG','P','DIV','SPAN','BR','H1','H2','H3','H4','UL','OL','LI','B','STRONG','I','EM','U','S','STRIKE','BLOCKQUOTE','TABLE','TBODY','THEAD','TR','TD','TH','HR','FONT']);function clean(node){for(const ch of [...node.children]){if(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','SVG','MATH','LINK','META'].includes(ch.tagName)){ch.remove();continue;}clean(ch);if(!allowed.has(ch.tagName)){ch.replaceWith(...ch.childNodes);continue;}for(const attr of [...ch.attributes]){if(attr.name==='style'){const keep={};for(const k of ['fontFamily','fontWeight','fontStyle','textDecoration','textAlign','fontSize','color','backgroundColor']){if(ch.style[k]&&!/url|expression/i.test(ch.style[k]))keep[k]=ch.style[k];}ch.removeAttribute('style');Object.assign(ch.style,keep);}else if(ch.tagName==='A'&&attr.name==='href'){if(!/^(https?:|mailto:|#)/i.test(attr.value))ch.removeAttribute(attr.name);}else if(ch.tagName==='IMG'&&attr.name==='src'){if(!/^data:image\/(png|jpeg|webp);base64,/i.test(attr.value))ch.remove();}else if(!(ch.tagName==='FONT'&&['color','size','face'].includes(attr.name)))ch.removeAttribute(attr.name);}}}clean(t.content);return t.innerHTML;}
function editorView(id){active=files.find(f=>f.id===id&&!f.deleted);if(!active){root.innerHTML=`<div class="dc-missing"><h2>文件暂时不可用</h2><p>文件可能在回收站中，或不属于此浏览器的本地空间。</p><button class="dc-btn primary" data-dc-action="back">返回云文档</button></div>`;return;}ensureDocTabs(active);active.opened=now();persist();selected='A1';rangeEnd='A1';root.innerHTML=`<div class="dc-app dc-editor-app">${rail()}<main class="dc-editor-main ${active.kind==='doc'?'der-doc-editor':'der-sheet-editor'}"><header class="dc-editor-head"><button class="dc-back" data-dc-action="back" title="返回云文档">‹</button>${docIcon(active)}<div class="dc-editor-title"><input id="dc-title" aria-label="文件名称" maxlength="100" value="${esc(active.name)}" ${editable()?'':'readonly'}><div class="dc-editor-sub"><button data-dc-action="star" title="收藏文件" class="${active.star?'isstar':''}">${active.star?'★':'☆'}</button><span class="dc-save ${storageOK?'':'error'}">${storageOK?'✓ 已保存到本机':'! 保存失败，请导出备份'}</span><span>${editable()?'我创建的 · 可编辑':'共享给我 · 仅查看'}</span></div></div><div class="dc-editor-actions"><button class="dc-btn" data-dc-action="history" title="版本记录">${svg('clock')}<span>历史</span></button><button class="dc-btn" data-dc-action="comments"><span class="dc-message-icon"><svg class="dc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H5l-3 2v-8a8.5 8.5 0 1 1 19-2.5Z"/><path d="M7 11h1m3 0h1m3 0h1"/></svg></span><span class="dc-message-label">消息</span> <b>${active.comments.length||''}</b></button><button class="dc-btn dc-sharebutton" data-dc-share="${esc(active.id)}">${svg('share')}分享</button></div></header><nav class="dc-menubar"><button data-dc-menu="file">文件</button><button data-dc-menu="edit">编辑</button><button data-dc-menu="insert">插入</button><button data-dc-menu="format">格式</button><span>${active.kind==='sheet'?'表格':'文档'}</span><button data-dc-action="help" class="dc-helpbutton">操作帮助</button></nav>${editable()?'':'<div class="dc-readonly">这是一份仅查看的共享示例。<button data-dc-action="duplicate">创建副本后编辑 →</button></div>'}${active.kind==='doc'?docSurface():sheetSurface()}</main></div>`;if(active.kind==='doc'){root.querySelector('#dc-body').innerHTML=safeBody(active.body);updateWordCount();root.querySelector('#dc-outline').innerHTML=outline();}else drawGrid();applyBaseTypography();}
function docSurface(){return makeDocSurface();}

function updateWordCount(){const b=root.querySelector('#dc-body');if(b)root.querySelector('.dc-wordcount').textContent=`${b.textContent.replace(/\s/g,'').length} 字 · 本机自动保存`;}
function saveBody(){if(!editable()||active.kind!=='doc')return;active.body=safeBody(root.querySelector('#dc-body').innerHTML);const currentTab=active.docTabs?.find(t=>t.id===active.activeDocTab);if(currentTab)currentTab.body=active.body;active.updated=now();updateWordCount();root.querySelector('#dc-outline').innerHTML=outline();clearTimeout(bodyTimer);root.querySelectorAll('.dc-save').forEach(badge=>badge.textContent='正在保存…');bodyTimer=setTimeout(()=>{bodyTimer=null;persist();},400);}

function displayCell(k){const s=sheet(),v=C.calculate(s.cells,k),style=s.styles?.[k]||{};if(typeof v!=='number')return v;if(style.format==='percent')return (v*100).toFixed(1)+'%';if(style.format==='currency')return '¥'+v.toFixed(2);if(style.format==='number')return v.toFixed(2);return String(Number(v.toPrecision(12)));}

function drawGrid(focusCell){const s=sheet();root.querySelector('.dc-grid thead').innerHTML='<tr><th class="dc-grid-corner"></th>'+Array.from({length:s.cols},(_,c)=>`<th>${C.colName(c)}</th>`).join('')+'</tr>';root.querySelector('.dc-grid tbody').innerHTML=Array.from({length:s.rows},(_,r)=>'<tr><th>'+ (r+1)+'</th>'+Array.from({length:s.cols},(_,c)=>{const k=C.address(r,c);return `<td data-address="${k}" style="${cellStyle(k)}"><input aria-label="${k}" data-dc-cell="${k}" value="${esc(displayCell(k))}" ${editable()?'':'readonly'} autocomplete="off" spellcheck="false"></td>`;}).join('')+'</tr>').join('');root.querySelector('#dc-sheettabs').innerHTML=active.sheets.map((s,i)=>`<button data-dc-sheet="${i}" class="${i===(active.activeSheet||0)?'active':''}" title="双击重命名工作表">${esc(s.name)} <span>⌄</span></button>`).join('');selectCell(selected);if(focusCell)root.querySelector(`[data-dc-cell="${selected}"]`)?.focus();}
function rangeKeys(){const a=C.pos(selected),b=C.pos(rangeEnd);if(!a||!b)return [];const out=[];for(let r=Math.min(a.r,b.r);r<=Math.max(a.r,b.r);r++)for(let c=Math.min(a.c,b.c);c<=Math.max(a.c,b.c);c++)out.push(C.address(r,c));return out;}
function selectCell(k,extend=false){if(!extend)selected=k;rangeEnd=k;root.querySelector('#dc-celladdress').value=selected===rangeEnd?selected:selected+':'+rangeEnd;root.querySelector('#dc-formula').value=sheet().cells[selected]||'';const fontStyle={...(active.typography||defaultStyles.sheet),family:sheet().styles?.[selected]?.fontFamily||(active.typography||defaultStyles.sheet).family,size:sheet().styles?.[selected]?.fontSize||(active.typography||defaultStyles.sheet).size};const familyControl=root.querySelector('#dc-family'),sizeControl=root.querySelector('#dc-font');if(familyControl)familyControl.value=fontStyle.family;if(sizeControl)sizeControl.value=String(fontStyle.size);root.querySelectorAll('.dc-grid td.selected,.dc-grid td.in-range').forEach(td=>td.classList.remove('selected','in-range'));for(const key of rangeKeys())root.querySelector(`[data-address="${key}"]`)?.classList.add(key===selected?'selected':'in-range');const nums=rangeKeys().map(k=>C.calculate(sheet().cells,k)).filter(v=>typeof v==='number');root.querySelector('#dc-selection-summary').textContent=rangeKeys().length>1?`已选 ${rangeKeys().length} 格　${nums.length?'求和：'+Number(nums.reduce((a,b)=>a+b,0).toPrecision(12)):''}`:'支持 SUM · AVERAGE · MIN · MAX · COUNT';}
function commitCell(k,value){if(String(sheet().cells[k]||'')===value)return;if(!needEdit())return;remember();if(value==='')delete sheet().cells[k];else sheet().cells[k]=value;touch();refreshCells();}

function undo(redo=false){if(active.kind==='doc'){command(redo?'redo':'undo');return;}if(!needEdit())return;const from=(redo?future:history).get(active.id)||[],to=(redo?history:future).get(active.id)||[];if(!from.length){toast(redo?'没有可重做的操作':'没有可撤销的操作');return;}to.push(C.copy(active));const old=from.pop();(redo?history:future).set(active.id,to);Object.assign(active,old);persist();drawGrid();}

function mobileShare(f){f.share||={access:'restricted',role:'view',people:[]};const readOnly=f.owner!=='me';const d=modal('分享【'+f.name+'】',`<label class="mp-share-search">${svg('search')}<input id="dc-invite-email" type="email" placeholder="输入姓名或者邮件地址" aria-label="协作者邮箱" ${readOnly?'disabled':''}><select id="dc-invite-role" aria-label="邀请权限" hidden><option value="view">可阅读</option><option value="edit">可编辑</option></select><button type="button" data-dc-action="invite" ${readOnly?'disabled':''}>添加</button></label><div class="dc-person mp-share-owner"><span class="dc-person-avatar">晋</span><div><b>${f.owner==='me'?'晋瑞':esc(f.owner)}</b><small>${f.owner==='me'?'burui2192@gmail.com':'文件所有者'}</small></div><span>所有者</span></div><div id="dc-share-people"></div><div class="mp-share-permissions"><label class="mp-share-org"><input id="mp-share-org" type="checkbox" ${f.share.org?'checked':''} ${readOnly?'disabled':''}>组织内成员</label><h3>常规访问权限</h3><div class="mp-share-access"><span id="mp-access-label">${f.share.access==='link'?'互联网获得链接的人':'受邀人员'}</span><select id="dc-linkrole" aria-label="访问权限" ${readOnly?'disabled':''}><option value="view">可阅读</option><option value="comment">可评论</option><option value="edit">可编辑</option></select></div><div class="mp-share-access-options"><label><input type="radio" name="mp-access" value="link" ${f.share.access==='link'?'checked':''} ${readOnly?'disabled':''}>互联网获得链接的人<span>✓</span></label><label><input type="radio" name="mp-access" value="restricted" ${f.share.access!=='link'?'checked':''} ${readOnly?'disabled':''}>仅受邀人员<span>✓</span></label></div></div>`, '<button class="dc-btn primary" type="button" data-dc-action="copylink">'+svg('share')+'复制链接</button>');d.classList.add('mp-share-dialog');d.dataset.fileId=f.id;d.querySelector('#dc-linkrole').value=f.share.role;drawPeople(d,f);d.addEventListener('change',()=>{if(readOnly)return;f.share.access=d.querySelector('[name="mp-access"]:checked').value;f.share.role=d.querySelector('#dc-linkrole').valu function exportFile(){flush();if(active.kind==='doc'){const body=root.querySelector('#dc-body');downloadFile(active.name+'.html','<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>'+esc(active.name)+'</title><body>'+(active.docTabs?.length>1?active.docTabs.map(t=>'<section><h1>'+esc(t.name)+'</h1>'+safeBody(t.body)+'</section>').join(''):safeBody(active.body))+'</body></html>','text/html;charset=utf-8');}else{const s=sheet();const keys=Object.keys(s.cells).map(C.pos).filter(Boolean);const maxR=Math.min(s.rows-1,Math.max(0,...keys.map(p=>p.r))),maxC=Math.min(s.cols-1,Math.max(0,...keys.map(p=>p.c)));const rows=[];for(let r=0;r<=maxR;r++){let row=[];for(let c=0;c<=maxC;c++){let v=String(C.calculate(s.cells,C.address(r,c)));if(/^[=+@\-]/.test(v)&&typeof C.calculate(s.cells,C.address(r,c))!=='number')v="'"+v;row.push('"'+v.replace(/"/g,'""')+'"');}rows.push(row.join(','));}downloadFile(active.name+'.csv','\ufeff'+rows.join('\r\n'),'text/csv;charset=utf-8');}toast('已导出到下载文件');}

function perform(action){document.querySelector('.dc-dropdown')?.remove();if(action.startsWith('doc-tab-')){docTabAction(action);return;}if(action==='styledefaults'){saveDefaultStyle();return;}if(action==='doclink'){modal('插入链接','<label class="dc-field">链接地址<input id="der-url" type="url" required placeholder="https://"></label>',null,d=>{const url=d.querySelector('input').value.trim();if(!/^https?:\/\//i.test(url))return false;command('createLink',url);});return;}if(action==='docimage'){insertLocalImage();return;}if(action.startsWith('mobile-')){mobileListAction(action);return;}if(action==='back'){navigate();return;}if(action==='refresh'){flush();if(storageOK)load();listView();toast(storageOK?'列表已刷新':'当前无法保存，已保留内存中的修改');return;}if(action==='sort'){sortDesc=!sortDesc;listView();return;}if(action==='clearsearch'){query='';listView();return;}if(!active&& !['help'].includes(action))return;

function zonedDate(ms,m){const d=zonedDateObject(ms,m);return (d.getUTCMonth()+1)+'/'+d.getUTCDate();}
function zonedLongDate(ms,m){const d=zonedDateObject(ms,m);return (d.getUTCMonth()+1)+'月'+d.getUTCDate()+'日 周'+['日','一','二','三','四','五','六'][d.getUTCDay()];}
function zoneCaption(m){const offset=m.timezone||m.interview?.zone||'+08:00';return 'GMT'+offset[0]+Number(offset.slice(1,3))+(offset.slice(4,6)==='00'?'':':'+offset.slice(4,6));}
function timeLabel(m){const end=m.start+m.duration*60000;return zonedDate(m.start,m)+' '+zonedClock(m.start,m)+' – '+(zonedDate(m.start,m)===zonedDate(end,m)?'':zonedDate(end,m)+' ')+zonedClock(end,m)+' ('+zoneCaption(m)+')';}
function primary(m){return m.status==='ended'?'会议回顾':m.status==='live'?'加入会议':'开始会议';}
function footer(){return `<nav class="m2-bottom" aria-label="工作台导航"><a href="#workspace">${svg('task')}<span>任务</span></a><a href="#cloud">${svg('doc')}<span>云文档</span></a><a href="#meetings" class="active" aria-current="page">${svg('video')}<span>云会议</span></a><span class="m2-inactive"><b>✧</b><span>AI</span></span><button data-m2="settings">${svg('settings')}<span>设置</span></button></nav>`;}
function meetingDate(ms){const d=new Date(ms);return (d.getMonth()+1)+'/'+d.getDate();}

function countdownText(m){const minutes=Math.ceil((m.start-Date.now())/60000);if(minutes<=0)return '';if(minutes<60)return minutes+'分钟后';if(minutes<1440){const h=Math.floor(minutes/60),n=minutes%60;return h+'小时'+(n?n+'分钟':'')+'后';}return Math.ceil(minutes/1440)+'天后';}
function agendaTime(ms){return new Date(ms).toLocaleTimeString('zh-CN',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit',hour12:false});}
function mobileAgenda(m){const interview=(m.meetingKind||m.type)==='面试会议',kind=interview?'面试会议':'安排会议',end=m.start+m.duration*60000,date=zonedLongDate(m.start,m);return `<div class="ma-layout ${interview?'ma-interview':''}"><div class="ma-type">${svg('calendar')}<span>${kind}</span>${m.recurring&&!interview?'<small>↻ 周二、周四、周六</small>':''}</div><div class="ma-body"><button class="ma-title" data-m2-detail="${esc(m.id)}"><strong data-ma-countdown="${esc(m.id)}">${countdownText(m)}</strong><span>${esc(m.title)}</span></button><div class="ma-info">${svg('clock')}<span>${date} ${zonedClock(m.start,m)} – ${zonedClock(end,m)} (${zoneCaption(m)})</span></div><div class="ma-info">${svg('video')}<span>${esc(m.number)}</span></div><div class="ma-info">${svg('person')}<span>${esc(m.host)}</span></div><div class="ma-actions">${meetingButton(m,'primary','开始会议')}${meetingButton(m,'copyinvite','复制邀请链接','secondary','<span aria-hidden="true">↗</span>')}${meetingButton(m,'more','···','more')}</div></div></div>`;}

function row(m){const live=m.status==='live',scheduled=m.status==='scheduled',interview=(m.meetingKind||m.type)==='面试会议',end=m.start+m.duration*60000,time=zonedDate(m.start,m)+' '+zonedClock(m.start,m)+' – '+(zonedDate(m.start,m)===zonedDate(end,m)?'':zonedDate(end,m)+' ')+zonedClock(end,m),kind=interview?'面试会议':m.type==='安排会议'?'安排':'普通';return `<article class="mc-card mc-record mc-${m.status}">${desktopMeetingRow(m,end)}<div class="ml-icon">${svg('video')}</div><div class="ml-content"><div class="mc-heading"><button class="mc-title" data-m2-detail="${esc(m.id)}">${esc(m.title)}</button>${meetingBadge(live?'进行中':scheduled?'未开始':'已结束',live?'green':'gray')}</div><div class="ml-time-people"><div class="ml-time">${svg('clock')}${time} (${zoneCaption(m)})</div><div class="ml-people">${svg('person')}${m.people} 人</div></div><div class="ml-type-number"><div class="ml-types">${meetingBadge(kind,interview?'green':'purple')}${m.recurring?meetingBadge('↻ 循环：周二、周四、周六','amber'):''}</div>${meetingId(m)}</div>${m.note||m.recurring?`<div class="ml-note">备注：${esc(m.note||'每周二、周四、周六')}</div>`:''}<div class="mc-actions">${live?meetingButton(m,'primary','继续进入 ›'):scheduled?meetingButton(m,'primary','开始会议')+meetingButton(m,'more','···','more'):meetingButton(m,'primary','会议回顾','secondary',svg('doc'))+meetingButton(m,'delete','删除','delete',svg('trash'))}</div></div></article>`;}
function normalizeMeetings(){
 const reserved=new Set(items.map(m=>String(m.number)).filter(n=>/^\d{7}$/.test(n)));
 const assigned=new Set();
 let changed=false,next=5556852;
 for(const meeting of items){
  let number=String(meeting.number);
  if(!reserved.has(number)||assigned.has(number)){
   while(reserved.has(String(next)))next++;
   number=String(next++);
   reserved.add(number);
  }
  assigned.add(number);
  if(meeting.number!==number){meeting.number=number;changed=true;}
 }
 if(changed)save();
}

function prepareJoin(m){prejoin={meeting:m,mic:false,camera:false};root.innerHTML=`<section class="pj-page"><header class="pj-header"><div class="mr-brand"><b>Der<span>●</span></b><strong>云会议</strong></div><button data-pj-action="back">← 返回工作台</button></header><main class="pj-shell"><div class="pj-meeting"><span>会议信息</span><h1>${esc(m.title)}</h1><p>${svg('video')}会议号 ${esc(m.number)}</p></div><div class="pj-grid"><div class="pj-preview-area"><div class="pj-preview"><div class="pj-avatar" id="pj-avatar">晋瑞</div><span class="pj-camera-caption">摄像头已关闭</span><small id="pj-name-label">晋瑞（我）</small></div><div class="pj-media"><button data-pj-action="mic" class="off">${roomIcon('mic')}<span>麦克风已关闭</span></button><button data-pj-action="camera" class="off">${roomIcon('camera')}<span>摄像头已关闭</span></button><select aria-label="麦克风设备"><option>默认麦克风</option></select><select aria-label="摄像头设备"><option>默认摄像头</option></select></div></div><form class="pj-form" id="pj-form"><h2>加入会议 <small>入会准备</small></h2><label>你的昵称<input id="pj-nickname" maxlength="30" value="晋瑞" autocomplete="nickname"><small>此昵称将展示给其他参会者。</small></label><label>会议密码<div class="pj-password"><input id="pj-password" type="password" inputmode="numeric" placeholder="6 位会议密码" autocomplete="off"><button type="button" data-pj-action="password" aria-label="显示或隐藏密码">◉</button></div></label><p class="pj-error" id="pj-error" aria-live="polite"></p><button class="pj-submit" type="submit">加入会议</button><p class="pj-terms">点击加入，即表示你同意《服务条款》和《隐私声明》。</p></form></div><p class="pj-notice">主持人可能开启会议转写，将发言转为文字并生成会议纪要。</p></main></section>`;root.querySelector('#pj-form').addEventListener('submit',e=>{e.preventDefault();confirmJoin();});root.querySelector('#pj-nickname').addEventListener('input',e=>{const name=e.target.value.trim()||'访客';root.querySelector('#pj-avatar').textContent=name;root.querySelector('#pj-name-label').textContent=name+'（我）';});}

p.dataset.m2Op]?.(m);return;}const a=e.target.closest('[data-m2]');if(a){switch(a.dataset.m2){case'refresh':draw();toast('会议列表已刷新');break;case'clear':query='';draw();root.querySelector('#m2-search').focus();break;case'schedule':toast('本次未优化');break;case'start':start();break;case'interview':interviewForm();break;case'join':join();break;case'settings':location.hash='workspace';setTimeout(()=>document.querySelector('[data-mobile-page="settings"]')?.click(),0);break;}}if(!e.target.closest('.m2-menu'))document.querySelector('.m2-menu')?.remove();});

function mobileTaskRow(t,board=false){const cs=children(t.id),progress=cs.length?`${cs.filter(x=>x.done).length}/${cs.length}`:t.progress||'';return `<article class="mp-task-row ${t.parent&&!board?'child':''} ${model.selected()===t.id?'selected':''}" data-mp-open="${esc(t.id)}"><button class="mp-check ${t.done?'done':''}" data-mp-toggle="${esc(t.id)}" aria-label="${t.done?'设为未完成':'完成'}${esc(t.title)}">${t.done?'✓':''}</button><div class="mp-task-info"><button class="mp-task-title" data-mp-open="${esc(t.id)}">${esc(t.title)}</button><div class="mp-task-meta"><span class="mp-status ${t.done?'done':''}">${t.done?'已完成':'未完成'}</span><span class="mp-owner">${t.owner?`<i>${esc(t.owner[0])}</i>${esc(t.owner)}`:'未分配'}</span><span class="mp-due">${ic('calendar')}${esc(dueLabel(t))}</span></div>${progress?`<div class="mp-subprogress"><span>子任务</span><div><i style="width:${cs.length?cs.filter(x=>x.done).length/cs.length*100:t.done?100:0}%"></i></div><b>${progress}</b></div>`:''}</div>${cs.length&&!board?`<button class="mp-expand" data-mp-expand="${esc(t.id)}" aria-label="展开或收起子任务">${ic(model.expanded()?'down':'right')}</button>`:'<span class="mp-task-chevron">›</span>'}</article>`;}
function referenceTaskRow(t){
 const count=t.total||children(t.id).length; const fields=[["创建人",t.creator],["负责人",t.owner],["开始",t.start],["截止",t.due],["完成",t.completed],["关注人",t.follower],["创建",t.created],["状态",t.status],["版本号",t.version]];
 return `<article class="ref-task" data-mp-open="${esc(t.id)}"><button class="mp-check ${t.done?"done":""}" data-mp-toggle="${esc(t.id)}" aria-label="切换任务完成状态">${t.done?"✓":""}</button><div class="ref-main"><div class="ref-title">${esc(t.title)}</div><div class="ref-badges">${count?`<span>主任务</span><span>${count}个子任务</span>`:""}</div></div><dl class="ref-fields">${fields.map(([label,value])=>`<div><dt>${label}</dt><dd title="${esc(value||"-")}">${esc(value||"-")}</dd></div>`).join("")}</dl><div class="ref-assignees">${Array.from(t.members||t.owner?.slice(0,1)||"").map(c=>`<i>${esc(c)}</i>`).join("")}${t.id==="h5-ref-1"?"<i>+1</i>":""}</div><button class="ref-open" aria-label="打开任务详情" data-mp-open="${esc(t.id)}">›</button></article>`;
}
function renderTaskList(){const all=filteredTasks(),list=state.query||state.view==='board'?all:all.filter(t=>!t.parent||model.expanded());const out=mobileRoot.querySelector('#mp-task-items');if(!out)return;if(state.view==='board')out.innerHTML=`<div class="mp-board">${[[false,'未完成'],[true,'已完成']].map(([done,name])=>{const group=list.filter(t=>t.done===done);return `<section><h3><i class="${done?'green':''}"></i>${name}<small>${group.length}</small></h3>${group.map(t=>mobileTaskRow(t,true)).join('')||'<div class="mp-board-empty">暂无任务</div>'}</section>`;}).join('')}</div>`;else {const examples=referenceTasks.filter(t=>(!state.query||t.title.toLowerCase().includes(state.query.toLowerCase()))&&(state.scope==='all'||(state.scope==='mine'?t.owner:t.creator)==='晋瑞')&&(state.status==='all'||(state.status==='done'?t.done:!t.done))&&state.due==='all');list.unshift(...examples);if(referenceHideDone){for(let i=list.length-1;i>=0;i--)if(list[i].done)list.splice(i,1);}out.innerHTML=list.map(referenceTaskRow).join('');}if(!list.length)out.innerHTML='<div class="mp-empty"><span>'+ic('tasks')+'</span><h3>暂无符合条件的任务</h3><p>调整筛选，或新建一项任务。</p><button data-mp="filter">调整筛选</button></div>';mobileRoot.querySelector('#mp-count').textContent=`${list.length} 项任务`;}
function renderMobileTasks(){const id=currentPath().startsWith('task/')?currentPath().split('/')[1]:null;if(id&&task(id)){renderTaskDetail(task(id));return;}mobileRoot.innerHTML=`<section class="mp-tasks-app ref-tasks"><header class="ref-brand"><button data-mp="task-menu" aria-label="任务菜单">☰</button><b>Der</b></header>
<div class="ref-project">${ic("tasks")}<strong>无极-产品需求表</strong><button data-mp="task-menu" aria-label="更多">···</button><button data-mp="search" aria-label="搜索">${ic("search")}</button><button class="ref-share" data-mp="task-share" aria-label="分享"><svg class="ic" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="18" cy="5" r="2"/><circle cx="18" cy="19" r="2"/><path d="m7 11 9-5m-9 7 9 5"/></svg></button></div>
<div class="mp-task-controls ref-tabs">${[["list","list","列表"],["board","board","看板"],["gantt","gantt","甘特图"],["dash","dash","仪表盘"],["activity","clock","动态"],["push","send","添加群组"]].map(([id,icon,label])=>`<button ${["list","board"].includes(id)?`data-mp-view="${id}"`: `data-mp="task-extra" data-label="${label}"`} class="${state.view===id?"active":""}">${ic(icon)}${label}</button>`).join("")}</div>
<div class="ref-tools"><div class="ref-new"><button data-mp="new">${ic("plus")}新建任务</button><button data-mp="new" aria-label="新建选项">${ic("down")}</button></div><button data-mp="filter">${ic("filter")}筛选</button><button data-mp="task-fields">${ic("sliders")}字段配置</button></div>
<div class="ref-refresh"><button data-mp="refresh-tasks">⟳ 刷新</button><label><input type="checkbox" id="ref-hide-done" ${referenceHideDone?"checked":""}>隐藏已完成任务</label></div>
<div class="mp-search ${state.search?"shown":""}"><label>${ic("search")}<input id="mp-search" value="${esc(state.query)}" placeholder="搜索任务名称"></label><button data-mp="search-close">取消</button></div><span id="mp-count" hidden></span><div id="mp-task-items" class="mp-task-scroll"></div>${footer("task")}</section>`;renderTaskList();}
function renderTaskDetail(t){const cs=children(t.id),parent=t.parent?task(t.parent):null;mobileRoot.innerHTML=`<section class="mp-detail-app"><header class="mp-detail-header"><button data-mp="back-tasks" aria-label="返回任务列表">‹</button><h2>任务详情</h2><button class="mp-detail-complete ${t.done?'done':''}" data-mp-toggle="${esc(t.id)}">${t.done?'✓ 已完成':'✓ 完成任务'}</button></header><div class="mp-detail-scroll">${parent?`<button class="mp-parent" data-mp-open="${esc(parent.id)}">${ic('list')}${esc(parent.title)} ›</button>`:''}<textarea id="mp-task-title" aria-label="任务名称" maxlength="120">${esc(t.title)}</textarea><div class="mp-detail-fields"><div><span>状态</span><button data-mp-toggle="${esc(t.id)}" class="mp-status ${t.done?'done':''}">${t.done?'已完成':'未完成'}</button></div><label><span>负责人</span><input id="mp-task-owner" value="${esc(t.owner)}" placeholder="未分配" maxlength="60"></label><label><span>截止时间</span><input id="mp-task-due" type="date" value="${esc(t.due||'')}"></label><div><span>创建人</span><b>${esc(t.creator)}</b></div><div><span>创建时间</span><b>${esc(t.created)}</b></div><div><span>所属清单</span><b>测试</b></div></div>${cs.length?`<section class="mp-detail-children"><h3>子任务 <small>${cs.filter(x=>x.done).length}/${cs.length}</small></h3>${cs.map(c=>`<div><button class="mp-check ${c.done?'done':''}" data-mp-toggle="${esc(c.id)}">${c.done?'✓':''}</button><button data-mp-open="${esc(c.id)}">${esc(c.title)}</button><span>›</span></div>`).join('')}</section>`:''}<section class="mp-detail-comments"><h3>评论</h3>${(model.comments[t.id]||[]).map(c=>`<article><span>${esc(c.author[0])}</span><div><small>${esc(c.author)}　${esc(c.time)}</small><p>${esc(c.text)}</p></div></article>`).join('')||'<p class="mp-no-comment">还没有评论</p>'}</section></div><div class="mp-comment-bar"><input id="mp-comment" placeholder="输入评论" aria-label="任务评论"><button data-mp="comment">发送</button></div></section>`;}
function showSettings(){modal('设置','<div class="mp-settings-profile"><span>晋</span><div><b>晋瑞</b><small>无极 · 当前账号</small></div></div><div class="mp-settings-row"><span>工作空间</span><b>无极</b></div><div class="mp-settings-row"><span>数据保存位置</span><b>当前浏览器</b></div><div class="mp-settings-row"><span>移动端界面</span><b>H5客户端</b></div>',null,'完成');}
function updateFrameMetrics(){const r=frame.getBoundingClientRect();document.body.style.setProperty('--port-left',r.left+'px');document.body.style.setProperty('--port-width',r.width+'px');document.body.style.setProperty('--port-bottom',Math.max(0,window.innerHeight-r.bottom)+'px');document.body.style.setProperty('--port-height',r.height+'px');}
const iterationRows=[["云会议·会议生命周期","允许参会者在规定时间内提前入会。参会人数归零或参会者退出时，不自动结束会议；用户仍可通过链接或会议号重新入会，仅主持人明确结束后才关闭会议。"],["登录","清理客户端邮箱输入框中的占位内容及复制粘贴产生的异常字符，完善邮箱格式校验。"],["任务","打开任务详情时，高亮对应任务行，明确任务及所属项目位置；切换详情时同步更新选中状态。"],["云文档","优化 H5客户端文档首页、新建入口、筛选、紧凑列表及文件操作菜单。"],["云会议","创建面试会议时增加时区选择，默认 UTC+8，并放在提前入会字段上方。"],["云会议","统一 Web／H5 会议字段与布局，优化即将开始、会议记录及邀请链接复制入口。"],["云文档","参考 Google 文档完善编辑交互，支持默认字体、字号、粘贴表格分列、文档标签页和自动目录。"],["会议中","移除会议画面右上角的置顶和聚焦所有人按钮，减少画面干扰。"],["会议悬浮","优化会议最小化后的悬浮窗口 UI，统一各端的布局、配色、图标和按钮样式。"],["会议中","悬浮窗口中，「最小化」按钮放在「进入会议」右侧。会议最小化期间，悬浮窗口不显示用户加入会议的提示。"],["会议中","统一各端举手后的图标颜色及选中状态，保持反馈一致。"],["入会准备","密码提示按校验结果显示：为空提示输入密码，填写错误时提示密码错误，默认不展示错误文案；原型正确密码为 123456。"],["会议中","统一顶部文字提示为「本场会议已开启自动转写，会议结束后可在「会议记录」查看转写与纪要」，点击「知道了」收起提示。"],["会议中","发言人开始说话后，麦克风图标延迟数秒才高亮。优化发言状态反馈，检测到发言时及时高亮图标。"],["会议记录","按会议开始时间倒序排列，开始时间越晚的会议越靠前。旧版 meeting-… 编号统一转换为七位数字会议号。即将开始列表按会议开始时间由近到远排序。"],["PC／桌面端共享界面","共享时移除底部参会人数显示。参会者面板移至右侧并默认展开，点击最小化后收起面板，以悬浮卡片显示当前发言人。沿用现有参会者逻辑。"]];
function showIterations(){window.DerCloud?.flush();document.querySelector('.iteration-dialog')?.remove();const d=document.createElement('dialog');d.className='iteration-dialog';d.setAttribute('aria-label','迭代清单');d.innerHTML=`<header><div><h2>迭代清单</h2><p>本次迭代需求清单</p></div><button data-iteration-close aria-label="关闭迭代清单">×</button></header><div class="iteration-scroll"><table><thead><tr><th>序号</th><th>功能模块</th><th>描述说明</th></tr></thead><tbody>${iterationRows.map(([module,description],i)=>`<tr class="${[9,10,12,14].includes(i+1)?"iteration-completed":""}" ${[9,10,12,14].includes(i+1)?'aria-label="已完成"':""}><td>${String(i+1).padStart(2,'0')}</td><td>${esc(module)}</td><td>${esc(description)}</td></tr>`).join('')}</tbody></table></div>`;d.addEventListener('click',e=>{if(e.target===d||e.target.closest('[data-iteration-close]'))d.close();});d.addEventListener('close',()=>d.remove());document.body.append(d);d.showModal();}
function setMode(mode){if(mode==='client')mode='h5';if(!['pc','h5'].includes(mode))return;window.DerCloud?.flush();state.mode=mode;document.body.classList.toggle('mobile-mode',mode!=='pc');document.body.dataset.port=mode;document.querySelectorAll('[data-port]').forEach(b=>{if(b===document.body)return;const on=b.dataset.port===mode;b.classList.toggle('active',on);b.setAttribute('aria-selected',String(on));});try{localStorage.setItem('der-preview-port',mode);}catch(e){}renderMobileTasks();enhanceEditor();requestAnimationFrame(updateFrameMetrics);}
function enhanceEditor(){const editor=cloudRoot.querySelector('.der-doc-editor');if(!editor)return;editor.classList.toggle('mp-outline-open',state.outline);if(!editor.querySelector('.mp-doc-mobilebar')){const bar=document.createElement('div');bar.className='mp-doc-mobilebar';bar.innerHTML='<button data-mp="outline">'+ic('list')+' 目录</button><span>文档正文</span>';editor.querySelector('.dc-editor-head').insertAdjacentElement('afterend',bar);}if(!editor.querySelector('.mp-editor-more')){const more=document.createElement('button');more.className='mp-editor-more';more.dataset.dcMenu='file';more.setAttribute('aria-label','文档更多操作');more.textContent='···';editor.querySelector('.dc-editor-actions').append(more);}if(!editor.querySelector('.mp-compact-toolbar')){const t=document.createElement('div');t.className='mp-compact-toolbar';t.innerHTML='<button data-dc-cmd="bold" title="加粗"><b>B</b></button><button data-dc-cmd="italic" title="斜体"><i>I</i></button><button data-mp="editor-tools" title="字体字号">T</button><button data-mp="editor-style">正文</button><button data-dc-action="doclink" title="链接">↔</button><button data-dc-menu="insert" title="插入">＋</button><button data-dc-cmd="undo" title="撤销">↶</button><button data-dc-cmd="redo" title="重做">↷</button><button data-mp="editor-tools" title="更多格式">···</button>';editor.querySelector('.der-doc-tools').prepend(t);}if(!editor.querySelector('.mp-doc-decoration')){const d=document.createElement('div');d.className='mp-doc-decoration';d.innerHTML='<span>☻ 添加图标</span><span>▧ 添加封面</span><button data-mp="outline" aria-label="文档目录">☷</button>';editor.querySelector('.dc-page-scroll').prepend(d);}if(!editor.querySelector('.mp-editor-bottom')){const b=document.createElement('div');b.className='mp-editor-bottom';b.innerHTML=footer('cloud');editor.append(b);}editor.querySelector('[data-dc-action="comments"]').setAttribute('aria-label','消息');const writing=editor.querySelector('.dc-writing');if(!writing.querySelector('.mp-outline-shade')){const shade=document.createElement('button');shade.className='mp-outline-shade';shade.dataset.mp='outline-close';shade.setAttribute('aria-label','关闭目录');writing.append(shade);}const heading=editor.querySelector('.der-tabs-heading');if(heading&&!heading.querySelector('.mp-outline-close')){const close=document.createElement('button');close.className='mp-outline-close';close.dataset.mp='outline-close';close.textContent='×';close.setAttribute('aria-label','关闭目录');heading.append(close);}}
const cloudMount=window.DerCloud.mount;window.DerCloud.mount=function(...args){cloudMount.apply(this,args);enhanceEditor();};new MutationObserver(()=>enhanceEditor()).observe(cloudRoot,{childList:true});
function route(){window.DerCloud?.flush();const path=currentPath();taskRoot.hidden=path==='cloud'||path.startsWith('cloud/')||path==='meetings';cloudRoot.hidden=!(path==='cloud'||path.startsWith('cloud/'));meetingRoot.hidden=path!=='meetings';if(!cloudRoot.hidden){window.DerCloud.mount(cloudRoot,path);}else if(!meetingRoot.hidden){window.DerMeetings.mount(meetingRoot);}else{if(path.startsWith('task/')&&task(path.split('/')[1]))model.open(path.split('/')[1]);else model.close();renderMobileTasks();}document.querySelector('#port-page-name').textContent=!cloudRoot.hidden?'云文档':!meetingRoot.hidden?'云会议':'任务';requestAnimationFrame(updateFrameMetrics);}
document.addEventListener('click',e=>{if(e.target.closest('[data-iteration-open]')){showIterations();return;}const button=e.target.closest('[data-port]');if(button&&button!==document.body){setMode(button.dataset.port);return;}if(e.target.closest('[data-rail-doc]')){jump('cloud');return;}if(e.target.closest('[data-rail-task]')){jump('workspace');return;}if(e.target.closest('[data-rail-meet]')){jump('meetings');return;}const toggle=e.target.closest('[data-mp-toggle]');if(toggle){const t=task(toggle.dataset.mpToggle);if(!t)return;t.done=!t.done;notifyModel();renderMobileTasks();return;}const open=e.target.closest('[data-mp-open]');if(open){jump('task/'+open.dataset.mpOpen);return;}const exp=e.target.closest('[data-mp-expand]');if(exp){model.setExpanded(!model.expanded());renderTaskList();return;}const view=e.target.closest('[data-mp-view]');if(view){state.view=view.dataset.mpView;renderMobileTasks();return;}const a=e.target.closest('[data-mp]');if(a){switch(a.dataset.mp){case'task-menu':filterSheet();break;case'task-fields':modal('字段配置','<p>创建人、负责人、开始、截止、完成、关注人、创建、状态、版本号</p>');break;case'task-extra':toast(a.dataset.label+'暂未接入');break;case'task-share':modal('分享任务清单','<p>无极-产品需求表</p>');break;case'refresh-tasks':renderTaskList();toast('已刷新');break;case'editor-tools':case'editor-style':{const editor=cloudRoot.querySelector('.der-doc-editor');editor?.classList.toggle('mp-tools-open');break;}case'new':newTask();break;case'filter':filterSheet();break;case'reset-filter':{const d=a.closest('dialog');for(const name of ['scope','status','due'])d.querySelector(`[name="${name}"][value="all"]`).checked=true;break;}case'search':state.search=true;renderMobileTasks();mobileRoot.querySelector('#mp-search').focus();break;case'search-close':state.search=false;state.query='';model.search('');renderMobileTasks();break;case'back-tasks':jump('workspace');break;case'outline':state.outline=!state.outline;enhanceEditor();break;case'outline-close':state.outline=false;enhanceEditor();break;case'settings':showSettings();break;case'comment':{const t=task(currentPath().split('/')[1]),field=mobileRoot.querySelector('#mp-comment');if(t&&field.value.trim()){model.comments[t.id]||=[];model.comments[t.id].push({author:'晋瑞',time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),text:field.value.trim()});saveTasks();renderMobileTasks();}break;}}}if(e.target.closest('[data-dc-heading]')&&state.mode!=='pc'){state.outline=false;setTimeout(enhanceEditor,0);}if(e.target.closest('#task-page>.app'))saveTasks();});
document.addEventListener('click',e=>{if(e.target.closest('[data-dc-action="mobile-settings"],[data-m2="settings"]')){e.preventDefault();e.stopImmediatePropagation();showSettings();return;}if(e.target.closest('[data-new-task]')){e.preventDefault();e.stopImmediatePropagation();newTask();return;}if(!e.target.closest('#task-page>.app'))return;if(e.target.closest('[data-close]')){e.preventDefault();e.stopImmediatePropagation();jump('workspace');return;}const pcCheck=e.target.closest('[data-check]');const pcComplete=e.target.closest('[data-complete]');if(pcCheck||pcComplete){e.preventDefault();e.stopImmediatePropagation();const t=task(pcCheck?pcCheck.dataset.check:model.selected());if(t){t.done=!t.done;notifyModel();renderMobileTasks();}return;}if(e.target.closest('[data-expand]'))return;const open=e.target.closest('[data-open]'),row=e.target.closest('[data-row]');if(open||row){e.preventDefault();e.stopImmediatePropagation();jump('task/'+(open?open.dataset.open:row.dataset.row));}},true);
document.addEventListener('input',e=>{if(e.target.id==='mp-search'){state.query=e.target.value;model.search(state.query);renderTaskList();}if(e.target.id==='search'){state.query=e.target.value;renderTaskList();}});
document.addEventListener('change',e=>{if(e.target.id==='ref-hide-done'){referenceHideDone=e.target.checked;renderTaskList();return;}const id=currentPath().split('/')[1],t=task(id);if(t&&['mp-task-title','mp-task-owner','mp-task-due'].includes(e.target.id)){if(e.target.id==='mp-task-title'){const value=e.target.value.trim();if(value)t.title=value;else e.target.value=t.title;}if(e.target.id==='mp-task-owner')t.owner=e.target.value.trim();if(e.target.id==='mp-task-due')t.due=e.target.value;notifyModel();}if(e.target.matches('#task-page .detail-title'))saveTasks();});
document.addEventListener('keydown',e=>{if(e.target.id==='mp-comment'&&e.key==='Enter')mobileRoot.querySelector('[data-mp="comment"]').click();});
window.addEventListener('hashchange',route);window.addEventListener('resize',updateFrameMetrics);setMode(state.mode);route();window.DerPortApp={state,setMode,filteredTasks,route};
})();
</script></body></html>
