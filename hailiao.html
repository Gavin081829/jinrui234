<title>51 嗨聊 · 直播门票预售</title>
<style>
:root{color-scheme:dark;--text:#f5f2f4;--muted:#b2a7b0;--line:#352932;--panel:#201820;--pink:#f22470;--soft:#ff8bb0}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 44%,#422331 0%,#1b131b 49%,#131017 82%);color:var(--text);font:14px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #ff619d;outline-offset:3px}
button:disabled{cursor:default;opacity:.55}
.masthead{max-width:1280px;margin:auto;padding:23px 36px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;gap:12px;align-items:center;font-weight:750;letter-spacing:.06em}
.mark{background:var(--pink);border-radius:10px;display:grid;place-items:center;width:35px;height:35px;color:white;font-size:17px;font-weight:850;letter-spacing:-.06em}
.device{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.layout{max-width:806px;margin:auto;padding:28px 36px 34px;display:grid;grid-template-columns:minmax(188px,1fr) 405px;align-items:start;gap:38px}
.intro{padding-top:12px}
h1{font-size:clamp(30px,3vw,43px);line-height:1.13;margin:0 0 14px;letter-spacing:-.045em}
.eyebrow{color:var(--soft);font-size:12px;font-weight:700;letter-spacing:.12em;margin-bottom:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:15px}
.panel h2{font-size:14px;margin:0 0 12px}
.scenarios{display:grid;gap:6px}
.scenarios button{background:#291f29;border:1px solid transparent;border-radius:8px;text-align:left;padding:7px 10px;min-height:37px}
.scenarios button:hover{background:#392633;border-color:#523646}
.scenarios button[aria-pressed=true]{background:#492439;border-color:#81425e;color:#ffc1d6}
.phone{position:relative;isolation:isolate;width:100%;max-width:393px;height:852px;overflow:hidden;border-radius:37px;background:#171321;box-shadow:0 0 0 1px #846272,0 0 0 6px #221923,0 25px 80px #100a1190;margin:auto;color:white}

        <button type="button" data-scene="viewerFree">观众 · 预售中未购票</button>
        <button type="button" data-scene="viewerBought">观众 · 预售中已购票</button>
        <button type="button" data-scene="viewerBlocked">观众 · 门票房拦截</button>
        <button type="button" data-scene="viewerPending">观众 · 切房时支付确认</button>
        <button type="button" data-scene="ended">观众 · 直播结束查订单</button>
      </div>
    </section>
  </section>
  <section class="preview" aria-label="直播间预览">
      <div id="phone" class="phone">
      <div id="video" class="video" aria-hidden="true"></div>
      <div class="shade" aria-hidden="true"></div>
      <div class="status" aria-hidden="true"><span>9:41</span><span class="signal"><i></i><span class="wifi"><b></b></span><span class="battery"></span></span></div>
      <div class="island" aria-hidden="true"></div>
      <div id="roomUi">
        <div class="roomhead">
          <span class="avatar" aria-hidden="true"></span>
          <span class="roomname">小佳的多人直播间<small>999获赞</small></span>
          <button class="pill follow" type="button" data-action="follow">已关注</button>
          <span class="pill">99人</span>
          <button class="icon" type="button" data-action="closeRoom" aria-label="关闭直播间">×</button>
        </div>
        <div class="notice"><span class="pink">▂▅▃</span> 直播中 · 欢迎各位大哥来看我</div>
        <div id="inRoom"></div>
        <div class="chat"><p>欢迎进入直播间</p><p>小星星 进入直播间</p><p>大大泡泡糖：晚上好</p></div>
        <div class="toolbar">
          <span class="chatbox">说点什么…</span>
          <button type="button" class="icon" data-action="like" aria-label="点赞">♡</button>
          <button type="button" class="icon" data-action="share" aria-label="分享">↗</button>
          <button id="more" type="button" class="icon" data-action="more" aria-label="更多操作">···</button>
        </div>
      </div>
      <div id="layer" class="layer" hidden></div>
      <div id="toast" class="toast" role="status" hidden></div>
      <div class="homebar" aria-hidden="true"></div>
    </div>
  </section>
</main>
<script>
const byId = id => document.getElementById(id);
const scenes = {
  hostFree: { role: 'host', phase: 'free', modal: 'upgrade' },
  hostSale: { role: 'host', phase: 'sale', otherSales: 3 },
  viewerFree: { role: 'viewer', phase: 'sale' },
  viewerBought: { role: 'viewer', phase: 'sale', order: 'paid' },
  viewerBlocked: { role: 'viewer', phase: 'paid' },
  viewerPending: { role: 'viewer', phase: 'paid', order: 'pending' },
  ended: { role: 'viewer', phase: 'ended', order: 'paid' }
};
let state;
let toastTimeout;
let opener;
const money = amount => '¥' + Number(amount).toFixed(2).replace(/\.00$/, '');
const isLocked = () => state.otherSales > 0 || ['pending','paid'].includes(state.order);
const remaining = () => Math.max(0, Math.ceil((state.deadline - Date.now()) / 1000));
function clock() {
  const seconds = remaining();
  return [Math.floor(seconds / 60), seconds % 60].map(n => String(n).padStart(2, '0')).join(':');
}
function button(label, action, css = '') {
  return '<button type="button" class="' + css + '" data-action="' + action + '">' + label + '</button>';
}
function detail(label, value) {
  return '<div><dt>' + label + '</dt><dd>' + value + '</dd></div>';
}
function timer() {
  return '<span class="clock" data-clock>' + clock() + '</span>';
}
function setScene(key) {
  const scene = scenes[key];
  state = {
    scene: key, role: scene.role, phase: scene.phase, order: scene.order || 'none',
    otherSales: scene.otherSales || 0, deadline: Date.now() + 5 * 60_000, price: 20,
    orderPrice: 20, payAt: scene.order === 'pending' ? Date.now() + 8000 : null, dismissed: false, collapsed: false, follow: true,
    liked: false, modal: scene.modal || null
  };
  clearTimeout(toastTimeout);
  byId('toast').hidden = true;
  opener = null;
  render();
}
function showToast(label) {
  const toast = byId('toast');
  toast.textContent = label;
  toast.hidden = false;
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toast.hidden = true, 4200);
}
function openModal(name) {
  opener = document.activeElement;
  state.modal = name;
  render();
  if (name !== 'presaleForm' && name !== 'directForm' && name !== 'editPrice') {
    byId('layer').querySelector('.dialog')?.focus();
  } else {
    byId('priceInput').focus();
  }
}
function closeModal() {
  state.modal = null;
  render();
  if (opener?.isConnected) opener.focus();
}
function toggleIcon(pointsUp = false) {
  return '<span class="toggle-icon' + (pointsUp ? ' up' : '') + '" aria-hidden="true">' +
    '<svg viewBox="0 0 16 16" fill="none" focusable="false">' +
    '<path d="M4.25 6.5 8 10l3.75-3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>' +
    '</svg></span>';
}
function roomContent() {
  if (state.phase === 'free' && state.role === 'host') {
    return '<div class="hostArea">' + button('升级为付费房', 'upgrade', 'hot') + '</div>';
  }
  if (state.phase === 'paid') {
    const label = state.role === 'host' ? '付费直播中' : '本场为付费直播 · 已购票';
    return '<div class="hostArea banner"><span aria-hidden="true">🎟 </span>' + label + '　门票 ' + money(state.price) + '</div>';
  }
  if (state.phase !== 'sale') return '';
  if (state.role === 'host') {
    const sales = state.otherSales + Number(state.order === 'paid');
    return '<div class="hostArea roomcard">' +
      '<div class="cardtop"><strong>门票预售中</strong>' + timer() + '</div>' +
      '<p>门票 ' + money(state.price) + ' · 已售 ' + sales + ' 张' +
      (sales ? ' · 票价已锁定' : state.order === 'pending' ? ' · 支付确认中' : '') + '</p>' +
      '<div class="cardbottom">' + (isLocked() ? '<span></span>' : button('修改票价', 'editPrice', 'minor')) +
      button('提前开启付费直播', 'early', 'minor') + '</div></div>';
  }
  if (state.collapsed) {
    return '<div class="presale"><button class="collapsed" type="button" data-action="expand" aria-expanded="false" aria-label="展开门票预售卡片">' +
      '<span>门票预售' + (state.order === 'paid' ? ' · 已购票' : '') + '</span>' + timer() + toggleIcon() + '</button></div>';
  }
  const status = state.order === 'paid' ? '<span class="paidflag">已购票</span>' :
    state.order === 'pending' ? '<button class="hot" type="button" disabled>正在确认购票结果</button>' :
      button('立即购票', 'buy', 'hot');
  return '<div class="presale roomcard"><div class="cardtop"><strong>付费直播门票预售</strong>' +
    '<div class="card-controls">' + timer() +
    '<button type="button" class="collapse" data-action="collapse" aria-expanded="true">收起' +
    toggleIcon(true) + '</button></div></div>' +
    '<p>当前可免费观看，倒计时结束后凭票继续观看</p>' +
    '<div class="cardbottom"><span class="price">' + money(state.price) + '</span>' + status + '</div></div>';
}
function dialog(title, body, actions = '') {
  return '<div class="dialog" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="dialog-title">' +
    '<h2 id="dialog-title">' + title + '</h2>' + body + (actions ? '<div class="actions">' + actions + '</div>' : '') + '</div>';
}
const sub = words => '<p class="sub">' + words + '</p>';
const cancel = () => button('取消', 'cancel', 'ghost');
function form(name) {
  const isSale = name === 'presaleForm';
  const edit = name === 'editPrice';
  const title = isSale ? '先预售门票' : edit ? '修改票价' : '升级付费房';
  const label = isSale ? '开启预售' : edit ? '保存票价' : '确认升级';
  const help = isSale ? '预售期间可免费观看，倒计时结束后自动进入门票房' :
    edit ? '首张门票售出后，票价将锁定' : '设置本场门票价格，升级后不可修改';
  return dialog(title, sub(help) + '<form id="ticketForm" data-form="' + name + '" novalidate>' +
    '<label for="priceInput">门票价格（元）</label>' +
    '<input id="priceInput" required inputmode="decimal" maxlength="6" autocomplete="off" aria-describedby="priceError" placeholder="请输入门票价格" value="' +
    (edit ? state.price : '') + '"><span class="error" id="priceError" role="alert" hidden></span>' +
    (isSale ? '<label for="durationInput">预售时长</label><select id="durationInput" required aria-describedby="durationError">' +
    '<option value="">请选择预售时长</option><option value="15">15 秒（快速演示）</option><option value="60">1 分钟</option><option value="180">3 分钟</option><option value="300">5 分钟</option><option value="600">10 分钟</option>' +
    '</select><span class="error" id="durationError" role="alert" hidden></span>' : '') +
    '<div class="actions">' + (edit ? cancel() : button('返回', 'upgrade', 'ghost')) + '<button class="confirm" type="submit">' + label + '</button></div></form>');
}
function activeDialog() {
  if (state.dismissed) {
    return dialog('已退出直播间', sub('重新进入时会刷新直播间和门票状态。'), button('重新进房', 'join', 'confirm'));
  }
  if (state.phase === 'ended') {
    if (state.modal === 'order' && state.role === 'viewer' && state.order === 'paid') {
      return dialog('门票订单', '<dl class="detail">' + detail('直播间', '小佳的多人直播间') +
        detail('支付金额', money(state.orderPrice)) + detail('支付状态', '已支付') + detail('场次状态', '直播已结束') + '</dl>',
        button('返回', 'cancel', 'ghost'));
    }
    const message = state.role === 'viewer' && state.order === 'pending' ? '正在确认购票结果…' : '感谢观看本场直播。';
    const orderButton = state.role === 'viewer' && state.order === 'paid' ? button('查看订单状态', 'order', 'confirm') : '';
    return dialog('直播已结束', sub(message), orderButton);
  }
  if (state.role === 'viewer' && state.phase === 'paid' && state.order === 'pending') {
    return dialog('正在确认购票结果', '<span class="spinner" aria-hidden="true"></span>' +
      sub('支付确认成功后将自动恢复观看。'), button('退出直播间', 'leave', 'ghost'));
  }
  if (state.role === 'viewer' && (state.modal === 'buy' || (state.phase === 'paid' && state.order !== 'paid'))) {
    const presale = state.phase === 'sale';
    return dialog('小佳的多人直播间', '<span class="avatar" aria-hidden="true"></span><div class="tag">' +
      (presale ? '付费直播门票预售' : '主播已升级为付费直播') + '</div>' +
      sub(presale ? '当前可免费观看，倒计时结束后凭票继续观看' : '购买本场门票，继续观看精彩直播') +
      '<div class="amount">' + money(state.price) + '</div>' + sub('本场有效 · 权益有效时间可再次进入<br>购票成功后不支持退票'),
      (presale ? cancel() : button('取消', 'leave', 'ghost')) + button('确认购票', 'pay', 'confirm'));
  }
  switch (state.modal) {
    case 'upgrade':
      return dialog('升级为付费房', sub('选择开启付费直播的方式。') +
        button('先预售门票', 'presaleForm', 'confirm pick') +
        button('直接开启付费直播', 'directForm', 'choice'),
        cancel());
    case 'presaleForm':
    case 'directForm':
    case 'editPrice':
      return form(state.modal);
    case 'early':
      return dialog('提前开启付费直播？', sub('提前开启后，未购票观众需购票才能继续观看'),
        cancel() + button('确认提前开启', 'forcePaid', 'confirm'));
    case 'hostMore': {
      const launch = state.phase === 'free' ? button('升级为付费房', 'upgrade', 'choice') : '';
      return dialog('主播操作', launch + button('结束直播', 'endConfirm', 'choice'), cancel());
    }
    case 'viewerMore':
      return dialog('直播间操作', button('退出直播间', 'leave', 'choice'), cancel());
    case 'endConfirm':
      return dialog('结束本场直播？', sub('结束后，已购票观众可查看订单状态。'),
        cancel() + button('确认结束直播', 'end', 'confirm'));
    default:
      return '';
  }
}
function updateCountdown() {
  const time = clock();
  document.querySelectorAll('[data-clock]').forEach(element => { element.textContent = time; });
}
function render() {
  document.querySelectorAll('[data-scene]').forEach(item => item.setAttribute('aria-pressed', item.dataset.scene === state.scene));
  const blocked = state.dismissed || state.phase === 'ended' || (state.phase === 'paid' && state.role === 'viewer' && state.order !== 'paid');
  byId('video').classList.toggle('blocked', blocked);
  byId('roomUi').hidden = blocked;
  byId('inRoom').innerHTML = roomContent();
  document.querySelector('[data-action="follow"]').textContent = state.follow ? '已关注' : '关注';
  document.querySelector('[data-action="like"]').textContent = state.liked ? '♥' : '♡';
  const content = activeDialog();
  byId('layer').innerHTML = content;
  byId('layer').hidden = !content;
  byId('roomUi').inert = Boolean(content);
  updateCountdown();
}
function becomePaid() {
  state.phase = 'paid';
  state.modal = null;
  state.collapsed = false;
  render();
  if (state.role === 'viewer' && state.order === 'paid' && !state.dismissed) showToast('门票房已开启，可继续观看');
}
function completePayment() {
  if (state.order !== 'pending') return;
  state.order = 'paid';
  state.payAt = null;
  render();
  if (state.role !== 'viewer' || state.dismissed) return;
  if (state.phase === 'sale') {
    showToast('购票成功，倒计时结束后可继续观看');
  } else if (state.phase === 'paid') {
    showToast('购票成功，已恢复观看');
  } else if (state.phase === 'ended') {
    showToast('购票结果已确认，可查看订单状态');
  }
}
function tick() {
  if (state.phase === 'sale' && Date.now() >= state.deadline) becomePaid();
  if (state.order === 'pending' && state.payAt !== null && Date.now() >= state.payAt) completePayment();
  updateCountdown();
}
function clearToast() {
  clearTimeout(toastTimeout);
  byId('toast').hidden = true;
}
function join() {
  clearToast();
  state.role = 'viewer';
  state.dismissed = false;
  state.collapsed = false;
  state.modal = null;
  tick();
  render();
}
const actions = {
  upgrade: () => openModal('upgrade'),
  presaleForm: () => openModal('presaleForm'),
  directForm: () => openModal('directForm'),
  editPrice: () => { if (!isLocked()) openModal('editPrice'); },
  early: () => openModal('early'),
  cancel: closeModal,
  forcePaid: () => { if (state.phase === 'sale') becomePaid(); },
  collapse: () => { state.collapsed = true; render(); byId('inRoom').querySelector('button')?.focus(); },
  expand: () => { state.collapsed = false; render(); byId('inRoom').querySelector('button')?.focus(); },
  buy: () => { if (state.order !== 'pending' && state.order !== 'paid') openModal('buy'); },
  pay: () => {
    if (!['sale', 'paid'].includes(state.phase) || ['pending', 'paid'].includes(state.order)) return;
    state.order = 'pending';
    state.orderPrice = state.price;
    state.payAt = Date.now() + 8000;
    state.modal = null;
    render();
    if (state.phase === 'sale') showToast('正在确认购票结果');
  },
  join,
  leave: () => { clearToast(); state.dismissed = true; state.modal = null; render(); },
  closeRoom: () => { if (state.role === 'host') openModal('endConfirm'); else actions.leave(); },
  more: () => openModal(state.role === 'host' ? 'hostMore' : 'viewerMore'),
  endConfirm: () => openModal('endConfirm'),
  end: () => { clearToast(); state.phase = 'ended'; state.modal = null; state.dismissed = false; render(); },
  order: () => openModal('order'),
  follow: event => {
    state.follow = !state.follow;
    event.textContent = state.follow ? '已关注' : '关注';
  },
  like: event => {
    state.liked = !state.liked;
    event.textContent = state.liked ? '♥' : '♡';
  },
  share: () => showToast('已打开分享入口（演示）')
};
document.addEventListener('click', event => {
  const control = event.target.closest('button');
  if (!control) return;
  if (control.dataset.scene) {
    setScene(control.dataset.scene);
  } else {
    actions[control.dataset.action]?.(control);
  }
});
function fieldError(input, error, message) {
  const text = byId(error);
  text.textContent = message;
  text.hidden = !message;
  input.setAttribute('aria-invalid', Boolean(message));
}
document.addEventListener('input', event => {
  if (event.target.id === 'priceInput') fieldError(event.target, 'priceError', '');
  if (event.target.id === 'durationInput') fieldError(event.target, 'durationError', '');
});
document.addEventListener('submit', event => {
  const form = event.target;
  if (form.id !== 'ticketForm') return;
  event.preventDefault();
  const kind = form.dataset.form;
  const input = byId('priceInput');
  const duration = byId('durationInput');
  const raw = input.value.trim();
  const value = Number(raw);
  const validPrice = /^\d{1,3}(\.\d{1,2})?$/.test(raw) && value >= 1 && value <= 999;
  const validDuration = !duration || ['15', '60', '180', '300', '600'].includes(duration.value);
  fieldError(input, 'priceError', validPrice ? '' : '请输入 ¥1–999 的门票金额，最多两位小数');
  if (duration) fieldError(duration, 'durationError', validDuration ? '' : '请选择预售时长');
  if (!validPrice || !validDuration) {
    (validPrice ? duration : input).focus();
    return;
  }
  if (kind === 'editPrice' && (state.phase !== 'sale' || isLocked())) return;
  if (kind !== 'editPrice' && state.phase !== 'free') return;
  state.price = value;
  state.modal = null;
  if (kind === 'directForm') {
    becomePaid();
  } else if (kind === 'presaleForm') {
    state.phase = 'sale';
    state.deadline = Date.now() + Number(duration.value) * 1000;
    state.collapsed = false;
    render();
  } else {
    render();
  }
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && state.modal) {
    event.preventDefault();
    closeModal();
  }
});
setScene('hostFree');
setInterval(tick, 250);
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
</script>
</body>
</html>
