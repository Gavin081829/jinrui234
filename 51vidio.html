<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11140f">
<title>51吃瓜 · 会员中心</title>
<style>
:root{color-scheme:dark;--bg:#101610;--card:#211e17;--line:#403829;--mute:#bdb5a3;--ink:#f5efe1;--green:#c6ec83;--deep:#182011;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-width:0;background:radial-gradient(ellipse at 50% 12%,#332a1b,#201c14 53%,#100f0c);color:var(--ink)}
button{border:0;color:inherit;font:inherit;cursor:pointer;background:transparent}
button:focus-visible{outline:2px solid var(--green);outline-offset:-3px}
[hidden]{display:none!important}
.device{position:relative;display:flex;flex-direction:column;margin:auto;width:min(100%,393px);height:852px;max-height:100dvh;background:var(--bg);overflow:hidden;isolation:isolate}
@media(min-width:520px) and (min-height:884px){.device{margin:16px auto;border-radius:34px;box-shadow:0 24px 96px #000b,0 0 0 1px #5a6650}}
.status{position:relative;height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:13px;font-weight:700}
.island{position:absolute;top:10px;left:50%;translate:-50% 0;width:113px;height:29px;border-radius:20px;background:#050704}
.indicators{display:flex;align-items:center;gap:6px}
.signal{display:flex;align-items:end;gap:2px;height:12px}
.signal i{width:3px;background:currentColor;border-radius:1px}
.signal i:nth-child(1){height:4px}.signal i:nth-child(2){height:6px}.signal i:nth-child(3){height:9px}.signal i:nth-child(4){height:12px}
.wifi{width:12px;height:9px;border-top:2px solid;border-radius:50%;position:relative}
.wifi::after{content:"";position:absolute;inset:2px 3px 0;border-top:2px solid;border-radius:50%}
.battery{width:18px;height:9px;border:1px solid #a6b19e;border-radius:3px;position:relative}
.battery::before{content:"";position:absolute;inset:1px;background:var(--ink);border-radius:1px}
.battery::after{content:"";position:absolute;right:-3px;top:2px;height:3px;width:2px;background:#a6b19e}
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 12px;height:46px;flex:none}
.nav h1{font-size:16px;margin:0;font-weight:700}
.back{width:44px;height:44px;display:grid;place-items:center;justify-self:start}
.chevron{display:inline-block;width:8px;height:8px;border-right:1.7px solid;border-bottom:1.7px solid;rotate:45deg;transition:rotate .2s}
.back .chevron{rotate:135deg;width:10px;height:10px;margin-left:3px}
.nav-link{justify-self:end;padding:0 4px;min-height:44px;font-size:12px;font-weight:650;color:var(--green);white-space:nowrap}
.viewport{flex:1;overflow:auto;overscroll-behavior:contain;overflow-anchor:none;scrollbar-width:none;padding:6px 16px 13px}
.home-indicator{height:17px;flex:none;display:grid;place-items:center;background:var(--bg)}
.home-indicator::after{content:"";display:block;width:116px;height:4px;border-radius:4px;background:#c4ccbf}
.device:has(#account[hidden]) .status,.device:has(#account[hidden]) .nav{position:relative;z-index:2}
.profile-banner{position:relative;isolation:isolate;margin:-6px -16px 0;padding:0 16px;overflow:clip}
.member-profile{position:relative;z-index:2;display:flex;align-items:center;width:100%;min-height:126px;padding:16px 0 20px;text-align:left}
.profile-copy{display:grid;gap:6px;min-width:0}
.profile-copy::before{content:"";width:35px;height:3px;margin-bottom:4px;border-radius:3px;background:linear-gradient(90deg,#f3cd7d 42%,transparent 42% 55%,#c89e54 55% 74%,transparent 74% 86%,#8d713e 86%)}
.profile-heading{font-size:24px;font-weight:850;line-height:1.18;letter-spacing:-.04em;color:#f1ebd3;text-shadow:0 2px 12px #101609}
.member-term{font-size:13px;line-height:1.4;color:#ecf2df;text-shadow:0 1px 5px #101609}
.poster-art{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 90% 27%,#3b462b7a,transparent 67%)}
.filmstrip{position:absolute;top:7px;right:-73px;width:340px;height:auto;transform:rotate(-17deg);opacity:.88;filter:blur(.7px) drop-shadow(0 9px 11px #131810)}
.poster-art::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 0%,#100f0cec 25%,#100f0c66 57%,#100f0c15 100%),linear-gradient(0deg,var(--bg) 0%,transparent 48%,#11140f3b)}
@media(max-width:350px){.profile-heading{font-size:21px}.member-term{font-size:12px}}
.muted{color:var(--mute);font-size:12px;margin:0;line-height:1.5}
/* The track sits above a stationary elliptical stage. */
.carousel{--position:0%;--drag:0px;--stage-glow:#9aa861;position:relative;isolation:isolate;overflow:clip;margin:0 -16px;touch-action:pan-y;user-select:none;background:radial-gradient(ellipse at 50% 100%,#40483065,transparent 58%)}
.carousel::after{content:"";position:absolute;z-index:-1;inset:0 0 28px;background:radial-gradient(ellipse at 50% 85%,color-mix(in srgb,var(--stage-glow) 18%,transparent),transparent 63%);pointer-events:none}
.carousel[data-active="vip"]{--stage-glow:#b19bdf}
.carousel[data-active="drama"]{--stage-glow:#cfab71}
.carousel[data-active="supreme"]{--stage-glow:#8bc8af}
.stage-base{position:absolute;z-index:-1;inset:auto 6px 7px;height:53px;border-radius:50%;background:radial-gradient(ellipse,color-mix(in srgb,var(--stage-glow) 25%,#141813),#20251a 66%,#121711 75%);border:1px solid color-mix(in srgb,var(--stage-glow) 39%,#292d24);box-shadow:0 4px 0 #2a2b23,0 9px 0 #171b14,0 12px 22px #040704}
.stage-base::before,.stage-base::after{content:"";position:absolute;inset:5px 9px;border:1px solid color-mix(in srgb,var(--stage-glow) 42%,transparent);border-radius:50%}
.stage-base::after{inset:10px 20px;border-color:color-mix(in srgb,var(--stage-glow) 25%,transparent)}
.card-track{display:flex;width:100%;padding:14px 0 35px;transform:translateX(calc(var(--position) + var(--drag)));transition:transform .38s cubic-bezier(.22,.7,.26,.99)}
.carousel.dragging .card-track,.carousel.dragging .member-card,.carousel.recentering .card-track,.carousel.recentering .member-card{transition:none}
.carousel.dragging .member-card{cursor:grabbing}
.card-slot{flex-grow:0;flex-shrink:0;min-width:0;padding:0 5px;perspective:680px;display:flex;position:relative}
.member-card{--edge:#a88bd2;--foil:#eadcff;--shine:#7952a4;--deep-tone:#251934;--turn:0deg;--depth:0px;--lift:0px;--fade:1;position:relative;isolation:isolate;display:grid;justify-items:center;align-content:center;gap:4px;width:100%;min-height:215px;padding:12px 7px;border:1px solid color-mix(in srgb,var(--foil) 72%,var(--edge));border-radius:18px;text-align:center;color:#f7f2ff;overflow:hidden;cursor:grab;opacity:var(--fade);background:radial-gradient(ellipse at 50% 27%,color-mix(in srgb,var(--shine) 35%,transparent),transparent 56%),linear-gradient(150deg,var(--deep-tone),#0d1110 57%,var(--deep-tone));box-shadow:inset 0 0 14px color-mix(in srgb,var(--edge) 48%,transparent),0 0 7px color-mix(in srgb,var(--edge) 23%,transparent),0 4px 0 color-mix(in srgb,var(--deep-tone) 84%,black);transform:translateY(var(--lift)) rotateY(var(--turn)) translateZ(var(--depth));transition:transform .38s cubic-bezier(.22,.7,.26,.99),opacity .38s,box-shadow .25s}
.member-card[data-plan="drama"]{padding-top:30px;--edge:#cba571;--foil:#ffe5b8;--shine:#956735;--deep-tone:#302318}
.member-card[data-plan="supreme"]{--edge:#83c6aa;--foil:#d6f8e5;--shine:#3f785f;--deep-tone:#142d24}
.member-card[aria-selected="true"]{box-shadow:inset 0 0 15px color-mix(in srgb,var(--edge) 30%,transparent),0 2px 14px color-mix(in srgb,var(--edge) 38%,transparent),0 4px 0 color-mix(in srgb,var(--edge) 44%,#101512)}
.member-card::before{content:"";position:absolute;z-index:-1;inset:0;background:radial-gradient(circle at 12% 31%,var(--foil) 0 1px,transparent 2.4px),radial-gradient(circle at 85% 38%,var(--foil) 0 1px,transparent 2px),radial-gradient(circle at 20% 75%,var(--edge) 0 1px,transparent 3px),radial-gradient(circle at 89% 70%,var(--edge) 0 1px,transparent 3px),linear-gradient(119deg,transparent 37%,#ffffff09 43%,transparent 52%);pointer-events:none}
.member-card::after{content:"";position:absolute;inset:7px;pointer-events:none;border:1px solid color-mix(in srgb,var(--edge) 37%,transparent);border-radius:12px;mask-image:radial-gradient(ellipse at center,transparent 56%,#000 76%);opacity:.74}
.card-medallion{display:grid;place-items:center;position:relative;width:52px;height:52px;margin:3px 0 2px;border:1px solid var(--edge);border-radius:50%;background:radial-gradient(circle at 40% 23%,color-mix(in srgb,var(--edge) 52%,var(--deep-tone)),var(--deep-tone));box-shadow:0 3px 9px color-mix(in srgb,var(--edge) 35%,transparent),inset 0 0 0 3px #0c0f1763;color:var(--foil)}
.card-medallion svg{width:63%;height:63%;overflow:visible;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;fill:color-mix(in srgb,currentColor 22%,transparent);filter:drop-shadow(0 2px 2px #101010a6)}
.card-medallion .facet{fill:none;stroke-opacity:.76}
.card-spark{position:absolute;width:11px;height:11px;background:var(--foil);opacity:.8;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%)}
.card-spark:first-of-type{top:0;right:-22px}
.card-spark:last-of-type{left:-21px;bottom:0;width:7px;height:7px;opacity:.52}
.recommend-ribbon{position:absolute;top:0;right:0;padding:4px 10px 5px 16px;border-bottom-left-radius:11px;background:linear-gradient(110deg,#f1dfba,#d2ab72);color:#30210b;font-size:10px;font-weight:850;line-height:1.2;box-shadow:0 2px 8px #fc9a4560}
.plan-name,.plan-terms,.plan-summary{display:block}
.plan-name{font-size:18px;line-height:1.18;font-weight:800;margin:0}
.plan-terms,.plan-summary{font-size:11px;line-height:1.3;color:#e4e4db}
.card-pricing{position:relative;display:grid;justify-items:center;gap:1px;margin:1px 0 0;padding:5px 10px 0;min-width:65%;white-space:nowrap;border-top:1px dashed color-mix(in srgb,var(--edge) 49%,transparent)}
.card-pricing::before,.card-pricing::after{content:"";position:absolute;top:-3px;width:5px;height:5px;border:1px solid var(--edge);border-radius:50%;background:var(--deep-tone)}
.card-pricing::before{left:-5px}.card-pricing::after{right:-5px}
.card-price{font-size:38px;line-height:1.02;font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:-.05em;color:var(--foil);text-shadow:0 0 10px color-mix(in srgb,var(--edge) 35%,transparent)}
.card-original{font-size:10px;color:#d2d0c9}
.card-original s{font-size:12px;text-decoration-thickness:1px}
.card-price small,.price small{font-size:14px;margin-right:3px;letter-spacing:0}
.plan-summary{margin-top:3px;padding:4px 9px;border:1px solid color-mix(in srgb,var(--edge) 50%,transparent);border-radius:16px;background:color-mix(in srgb,var(--edge) 12%,transparent)}
.price{display:flex;align-items:baseline;justify-content:end;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.06em;white-space:nowrap}
#plan-benefits{position:relative;margin:10px 0 6px;padding:12px;border:1px solid #4d4127;border-radius:16px;background:linear-gradient(145deg,#241f16,#191711)}
.benefits-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px;padding:0 2px 5px;border-bottom:1px solid #483c28}
.perk-title{margin:0;color:#eeefe2;font-size:16px;font-weight:750}
.compare-trigger{min-height:40px;padding:3px 3px 3px 7px;color:var(--green);font-size:12px;font-weight:700;white-space:nowrap}
.compare-trigger span{margin-left:4px;font-size:14px}
.visual-perks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;list-style:none;padding:0;margin:0}
.visual-perks li{display:flex;align-items:center;gap:7px;min-height:39px;padding:4px 6px;border:1px solid #4c3f28;border-radius:9px;background:#242017;color:#e0e8da;font-size:12px;line-height:1.35}
.perk-icon{display:grid;flex:none;place-items:center;width:28px;height:28px;border-radius:8px;background:#3e3220;color:#f3d081}
.visual-perks li:first-child .perk-icon{background:#423b2a;color:#f3daab}
.perk-icon svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.55;fill:none;stroke-linecap:round;stroke-linejoin:round}
.purchase-dock{display:grid;grid-template-columns:minmax(133px,.92fr) minmax(0,1.08fr);align-items:center;gap:12px;padding:11px 16px 9px;background:#211d14;border-top:1px solid #53422a;box-shadow:0 -10px 22px #080d0855;flex:none}
.purchase-dock p{margin:0}
.dock-name{color:#e1ead9;font-size:12px;line-height:1.25;overflow-wrap:anywhere}
.dock-offer{display:flex;align-items:center;gap:7px;min-height:36px}
.saving-bubble{position:relative;flex:none;white-space:nowrap;padding:4px 6px;border:1px solid #ff9b9f;border-radius:9px;background:#ffd3d4;color:#781e30;font-size:11px;font-weight:750;line-height:1.18}
.saving-bubble::before{content:"";position:absolute;top:50%;left:-4px;width:6px;height:6px;border:solid #ff9b9f;border-width:0 0 1px 1px;background:#ffd3d4;transform:translateY(-50%) rotate(45deg)}
.dock-price{color:var(--green);font-size:33px;font-weight:850;line-height:1.08;font-variant-numeric:tabular-nums;letter-spacing:-.045em}
.dock-price small{font-size:13px;letter-spacing:0;margin-right:2px}
.purchase-dock .primary{min-height:50px;padding-inline:6px;background:linear-gradient(112deg,#ffe18c,#f8c54d);border-radius:12px;font-size:14px}
.purchase-dock .primary:disabled{background:#38452e;color:#cfddc3}
.purchase-dock:not([hidden])+.home-indicator{background:#211d14}
.perks{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:5px 7px}
.perks.single{grid-template-columns:1fr}
.perks li{display:flex;align-items:center;min-height:26px;gap:5px;padding:3px 6px;background:#161d13;border:1px solid #36462b;border-radius:6px;font-size:14px;line-height:1.25;overflow-wrap:anywhere}
.check{display:grid;place-items:center;color:var(--green);font-size:12px;flex:none}
.primary{display:block;width:100%;min-height:48px;border-radius:11px;background:var(--green);color:#261904;font-weight:800;font-size:15px;padding:8px 10px}
.primary:active{background:#aee935}
.primary:disabled{background:#38452e;color:#cfddc3;cursor:default}
.account-list{display:grid;gap:12px;margin-top:12px}
.account-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.account-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.account-title h3{margin:0;font-size:16px}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.record-price{color:var(--green);font-weight:800;font-variant-numeric:tabular-nums}
.record-note{color:var(--mute);font-size:12px;line-height:1.5;margin:0}
.pill{border-radius:20px;padding:4px 8px;background:#35471f;color:#d0ffa2;font-size:11px;white-space:nowrap}
.account-card .perks{margin-top:12px}
.account-header{margin:7px 0 14px}
.account-header h2{font-size:22px;margin:0 0 5px}
.account-actions{display:grid;gap:8px;margin-top:14px}
.secondary{min-height:44px;padding:8px 12px;color:var(--mute);font-size:13px}
dialog{inset:auto auto 0 50%;transform:translateX(-50%);margin:0;width:min(100%,393px);max-width:none;max-height:min(750px,100dvh);padding:0;border:1px solid #55462d;border-radius:22px 22px 0 0;background:#241f15;color:var(--ink);box-shadow:0 -12px 36px #0006}
@media(min-width:520px) and (min-height:884px){dialog{bottom:calc(100dvh - 868px);border-radius:22px 22px 34px 34px}}
dialog::backdrop{background:#080b07b5}
.sheet{padding:8px 16px 20px}
.sheet-handle{width:30px;height:3px;margin:0 auto 6px;border-radius:4px;background:#667560}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;gap:10px}
.sheet-head h2{margin:0;font-size:19px}
.close{width:44px;height:44px;border-radius:50%;font-size:23px;color:#c4cfbf}
.order{background:#151b13;border:1px solid #3a4832;border-radius:13px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.order strong{font-size:15px}
.order p{margin:4px 0 0}
.order .price{color:var(--green)}
fieldset{padding:0;border:0;margin:14px 0 11px;display:grid;gap:7px}
legend{padding:0;margin-bottom:7px;font-size:13px;font-weight:700}
.method{display:flex;align-items:center;min-height:51px;gap:9px;background:#192116;padding:8px 10px;border-radius:10px;border:1px solid #384631;font-size:14px;cursor:pointer}
.method:has(input:checked){border-color:#d4ae5f}
.method input{margin-left:auto;accent-color:#a9e247;width:17px;height:17px}
.method-icon{display:grid;place-items:center;width:27px;height:27px;border-radius:7px;background:#166938;color:#fff;font-weight:700;font-size:13px}
.method-icon.ali{background:#1264a8}
.sheet-note{text-align:center;margin:8px 0 0;color:#f1f3ec;font-size:14px;line-height:1.5}
.support-link{display:inline-block;min-height:36px;padding:0 1px;color:#ffce73;font-weight:650}
.support-link:focus-visible,.support-link:hover{text-decoration:underline}
.support-message{margin:0;text-align:center;font-size:12px;color:var(--mute);line-height:1.5}
.result-mark{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;margin:0 auto 8px;background:#344b21;color:var(--green);font-size:24px}
.result-name{text-align:center;font-size:16px;font-weight:700;margin:0 0 7px}
.result-meta{text-align:center;margin:0 0 12px}
.result-summary{margin:0 0 12px}
@media(max-width:365px){.plan-name{font-size:16px}.plan-summary{font-size:10px;padding-inline:5px}.card-price{font-size:33px}.price{font-size:22px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
.compare-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px;text-align:center}
.compare-table caption{text-align:left;color:var(--mute);font-size:12px;margin:0 0 10px}
.compare-table th,.compare-table td{padding:8px 3px;border-bottom:1px solid #394639;overflow-wrap:anywhere}
.compare-table th:first-child{width:31%;text-align:left}
.compare-table thead th{color:#f0ebd8;font-size:11px}
.compare-table tbody th{font-weight:550}
.compare-table .current{background:#514126}
.compare-table .checkmark{color:var(--green);font-weight:800}
.compare-table small{display:block;margin-top:3px;color:var(--green)}
.version-tabs{display:flex;flex:none;justify-content:center;gap:4px;padding:3px 4px;margin:1px auto 3px;border:1px solid #483921;border-radius:13px;background:#1d1810}
.version-tabs button{height:33px;min-width:82px;border-radius:9px;color:#c5b89f;font-size:12px;font-weight:650}
.version-tabs button[aria-pressed="true"]{background:#efd091;color:#261a0b;font-weight:800}
.catalog-tabs{display:flex;align-items:stretch;gap:7px;height:44px}
.catalog-tabs button{position:relative;padding:0 10px;color:#e9e3d6;font-size:16px;font-weight:700}
.catalog-tabs button[aria-pressed="true"]{color:#ffcf57}
.catalog-tabs button[aria-pressed="true"]::after{content:"";position:absolute;width:18px;height:3px;bottom:2px;left:50%;transform:translateX(-50%);border-radius:9px;background:#ffcf57}
.coin-panel{padding:24px 14px;text-align:center}
.coin-panel h2{margin:0 0 7px;font-size:19px}
.device[data-version="2"]{--bg:#101610;--green:#c6ec83}
.device[data-version="2"] .nav{background:linear-gradient(90deg,#161f17,#1b261c)}
.device[data-version="2"] .member-profile{min-height:100px}
.device[data-version="2"] .profile-heading{color:#d9f79e;font-size:27px}
.device[data-version="2"] .profile-copy::before{display:none}
.device[data-version="2"] .filmstrip{right:-18px;width:320px}
.device[data-version="2"] .card-track{padding:12px 0 26px}
.device[data-version="2"] .carousel{--stage-glow:#93b96b}
.device[data-version="2"] .stage-base{inset:auto 16px 23px;height:44px}
.stage-pages{display:none}
.device[data-version="2"] .stage-pages{position:relative;display:flex;justify-content:center;height:21px;margin-top:-4px}
.stage-pages button{display:grid;place-items:center;width:30px;height:21px;padding:0}
.stage-pages button::after{content:"";width:6px;height:6px;border-radius:9px;background:#566b51}
.stage-pages button[aria-current="true"]::after{width:15px;background:#c6ec83}
.device[data-version="2"] .member-card{min-height:240px;grid-template-rows:auto auto 1fr auto;align-content:stretch;align-items:center;justify-items:start;gap:3px;border-radius:13px;border-color:#5d7d4c;padding:13px 9px 9px;background:linear-gradient(150deg,#18271c,#0c1410 42%,#151f17);text-align:left}
.device[data-version="2"] .member-card[aria-selected="true"]{border-color:#d5f895;box-shadow:inset 0 0 9px #a9c87a52,0 0 13px #a9c87a50}
.device[data-version="2"] .member-card[data-plan="drama"]{padding-top:24px}
.device[data-version="2"] .member-card::before,.device[data-version="2"] .member-card::after,.device[data-version="2"] .card-spark,.device[data-version="2"] .plan-summary{display:none}
.device[data-version="2"] .plan-name{font-size:clamp(12px,4.45vw,18px);color:#dfedcc}
.device[data-version="2"] .plan-terms{font-size:10px}
.device[data-version="2"] .card-medallion{width:100%;height:128px;margin:0;border:0;border-radius:8px;background:#0c140e var(--crest) center/contain no-repeat;box-shadow:none;mask-image:radial-gradient(ellipse at 50% 50%,#000 48%,transparent 78%)}
.device[data-version="2"] .card-medallion svg{display:none}
.device[data-version="2"] .card-pricing{justify-items:start;border:0;padding:0;margin:0;gap:3px}
.device[data-version="2"] .card-pricing::before,.device[data-version="2"] .card-pricing::after{display:none}
.device[data-version="2"] .card-price{font-size:32px;color:#d4f496}
.device[data-version="2"] #plan-benefits{margin-top:7px;padding:10px 8px 12px;border-color:#4c6844;background:linear-gradient(145deg,#232f23,#18231a)}
.device[data-version="2"] .visual-perks{grid-template-columns:repeat(4,minmax(0,1fr));gap:9px 3px}
.device[data-version="2"] .visual-perks li{flex-direction:column;justify-content:start;text-align:center;gap:5px;padding:2px 0;border:0;background:none;color:#e3eedb;font-size:11px}
.device[data-version="2"] .perk-icon,.device[data-version="2"] .visual-perks li:first-child .perk-icon{width:38px;height:38px;border-radius:50%;border:1px solid #6e895a;background:radial-gradient(circle at 50% 10%,#506547,#2a392b);color:#d1ed9b}
.device[data-version="2"] .purchase-dock{grid-template-columns:1fr;gap:2px;padding:10px 13px 4px;background:#1b261c}
.device[data-version="2"] .purchase-dock>div{display:none}
.device[data-version="2"] .purchase-dock .primary{min-height:46px;border-radius:9px;background:linear-gradient(100deg,#e0f5b2,#b2dc6c);font-size:16px}
.device[data-version="2"] .purchase-dock .primary:disabled{background:#344a31;color:#c6d7ba}
.dock-support{text-align:center;color:#c0b6a3;font-size:12px}
.dock-support .support-link{min-height:32px}

   <p class="muted">暂无可购买的金币套餐</p>
  </section>
  <section id="account" hidden>
   <div class="account-header"><h2 tabindex="-1" id="account-title">我的会员与权益</h2><p class="muted" id="account-summary"></p></div>
   <div class="account-list" id="account-list"></div>
   <div class="account-actions"><button class="primary" id="to-shop">查看会员套餐</button><button class="secondary" id="reset" hidden>重置演示记录</button></div>

  <section id="history" hidden>
   <h2 id="history-title" tabindex="-1" class="visually-hidden">充值记录</h2>

 </main>
 <footer class="purchase-dock" id="purchase-dock">
  <div aria-live="polite" aria-atomic="true"><p class="dock-name" id="dock-name"></p><div class="dock-offer"><p class="dock-price" id="dock-price"><small>¥</small><span id="dock-amount"></span></p><span class="saving-bubble" id="dock-savings" title="按示例原价计算"></span></div></div>

  <p class="support-message" id="dock-support-note" hidden>在线客服暂未接入。</p>
 </footer>
 <div class="home-indicator" aria-hidden="true"></div>
</div>

 <div class="sheet">
  <div class="sheet-handle" aria-hidden="true"></div>
  <div class="sheet-head"><h2 id="sheet-title">确认购买</h2><button class="close" id="close-sheet" aria-label="关闭">×</button></div>
  <div id="payment">
   <div class="order"><div><strong id="order-name"></strong><p class="muted" id="order-terms"></p></div><div class="price" id="order-price"></div></div>
   <fieldset><legend>选择支付方式</legend>
    <label class="method"><span class="method-icon" aria-hidden="true">微</span>微信支付<input type="radio" name="pay" value="微信支付" checked></label>
    <label class="method"><span class="method-icon ali" aria-hidden="true">支</span>支付宝<input type="radio" name="pay" value="支付宝"></label>
   </fieldset>
   <button class="primary" id="confirm-pay"></button>
   <p class="sheet-note">支付问题反馈，点击联系<button class="support-link" id="payment-support" type="button" aria-expanded="false" aria-controls="payment-support-message">在线客服</button></p>
   <p class="support-message" id="payment-support-message" aria-live="polite" hidden>在线客服暂未接入，可在「充值记录」查看模拟支付结果。</p>
  </div>
  <div id="success" hidden>
   <div class="result-mark" aria-hidden="true">✓</div>
   <p class="result-name" id="result-name"></p>
   <p class="muted result-meta" id="result-meta"></p>
   <div id="result-summary" class="result-summary"></div>
   <button class="primary" id="view-result">查看我的权益</button>
  </div>
 </div>
</dialog>
<dialog id="comparison" aria-labelledby="comparison-title">
 <div class="sheet">
  <div class="sheet-handle" aria-hidden="true"></div>
  <div class="sheet-head"><h2 id="comparison-title">套餐对比</h2><button class="close" id="close-comparison" type="button" aria-label="关闭">×</button></div>
  <div id="comparison-content"></div>
 </div>
</dialog>
<script>
"use strict";

const plans = [
  { id:"vip", name:"终身VIP卡", price:100, exampleOriginalPrice:198, terms:"一次购买，永久享受", summary:"永久VIP · 金币视频5折", perks:["永久VIP","金币视频5折","免广告","极速播放","修改资料","VIP短剧免费"] },
  { id:"drama", name:"短剧畅享卡", price:200, exampleOriginalPrice:298, terms:"一次购买", summary:"金币短剧、VIP短剧免费", perks:["金币短剧免费","VIP短剧免费","免广告","极速播放","修改资料"] },
  { id:"supreme", name:"终身至尊双享卡", price:300, exampleOriginalPrice:498, terms:"一次购买", summary:"片库视频免费 · 金币及VIP短剧免费", perks:["片库视频免费","永久VIP","金币短剧免费","VIP短剧免费","免广告","极速播放","修改资料"] }
];

const accountPlans = [...plans, { id:"monthly", name:"体验月卡", price:50, perks:["赠金币68"] }];

const byId = id => document.getElementById(id);
const storageKey = "51chigua-membership-demo-v1";
const cardList = byId("plans");
let cardWidth = 65;
let cardStep = 55;
let version = "1";
let onCoins = false;
const device = byId("membership-device");
const carousel = byId("carousel");
const benefits = byId("benefits-content");
const dock = byId("purchase-dock");
const buy = byId("buy-plan");
const viewport = byId("viewport");
const checkout = byId("checkout");
const dateLabel = new Intl.DateTimeFormat("zh-CN", {timeZone:"Asia/Shanghai", year:"numeric", month:"long", day:"numeric", hour:"2-digit", minute:"2-digit", hourCycle:"h23"});
let active = 1;
const centerStart = plans.length * 2;
const cardCopies = Array.from({length:plans.length * 5}, (_, index) => plans[index % plans.length]);
let position = centerStart + active;
let recenterTimer;
let pending = null;
let shopScroll = 0;
let records = [];

try {
  const saved = JSON.parse(localStorage.getItem(storageKey));
  if (Array.isArray(saved)) {
    records = saved.filter(record => record && accountPlans.some(plan => plan.id === record.id) &&
      Number.isFinite(record.paidAt) &&
      (record.id !== "monthly" || Number.isFinite(record.expiresAt)));
  }
} catch {
  // Playback of the prototype still works when local storage is unavailable.
}

function writeRecords() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(records));
  } catch {
    // Keep the demo state in memory when local storage is unavailable.
  }
}

function perkList(plan) {
  const items = plan.perks.map(perk => '<li><span class="check" aria-hidden="true">✓</span>' + perk + '</li>').join("");
  return '<ul class="perks' + (plan.perks.length === 1 ? ' single' : '') + '">' + items + '</ul>';
}

const perkIcons = {
  "赠金币68": '<circle cx="12" cy="12" r="9"/><path d="m9 8 3 4 3-4m-6 5h6m-6 3h6m-3-4v6"/>',
  "永久VIP": '<path d="m3 8 4 4 5-7 5 7 4-4-2 10H5L3 8Zm2 13h14"/>',
  "金币视频5折": '<path d="M3 8V4h5l12 12-5 5L3 9Z"/><circle cx="7" cy="8" r="1"/><path d="m13 16 3-3"/>',
  "免广告": '<path d="M12 3 4 6v5c0 5 3 8 8 10 5-2 8-5 8-10V6l-8-3Z"/><path d="m8 12 3 3 5-6"/>',
  "极速播放": '<path d="m13 2-8 12h6l-1 8 9-12h-6l1-8Z"/>',
  "修改资料": '<path d="m4 20 4-1L20 7l-4-4L4 15l-1 6 5-2m6-14 4 4"/>',
  "VIP短剧免费": '<rect x="3" y="6" width="18" height="13" rx="2"/><path d="m10 9 5 3.5-5 3.5V9Z"/>',
  "金币短剧免费": '<rect x="3" y="5" width="17" height="12" rx="2"/><path d="m9 8 5 3-5 3V8Zm4 12h8m-3-3v6"/>',
  "片库视频免费": '<path d="M5 5h15M5 9h15M5 13h15M5 17h15M5 21h15M2 5h.1M2 9h.1M2 13h.1M2 17h.1M2 21h.1"/>'
};

function visualPerks(plan) {
  const items = plan.perks.map(perk =>
    `<li><span class="perk-icon" aria-hidden="true"><svg viewBox="0 0 24 24">${perkIcons[perk]}</svg></span><span class="perk-full">${perk}</span></li>`
  ).join("");
  return `<ul class="visual-perks">${items}</ul>`;
}

const cardMarks = {
  vip: '<path d="m4 12 8 6 8-11 8 11 8-6-4 15H8Z"/><path class="facet" d="M10 32h20m-12-9 2-3 2 3-2 3Z"/><circle cx="4" cy="11" r="1.8"/><circle cx="20" cy="6" r="1.8"/><circle cx="36" cy="11" r="1.8"/>',
  drama: '<rect x="5" y="8" width="30" height="24" rx="5"/><path d="m17 15 9 5-9 5Z"/><path class="facet" d="M10 13v2m0 10v2m20-14v2m0 10v2"/>',
  supreme: '<path d="m4 16 7-9h18l7 9-16 17Z"/><path class="facet" d="M4 16h32M11 7l2 9 7 17 7-17 2-9M13 16l7-9 7 9"/>'
};

function renderPlans() {
  cardList.innerHTML = cardCopies.map((plan, index) => `
    <div class="card-slot" style="flex-basis:var(--card-width);margin-right:var(--card-overlap)" role="presentation">
      <button class="member-card" type="button" id="head-${index}" data-index="${index}" data-plan="${plan.id}" role="tab" aria-controls="panel-${plan.id}" aria-selected="false" tabindex="-1">
        ${plan.id === "drama" ? '<span class="recommend-ribbon">推荐购买</span>' : ""}
        <span class="plan-name">${plan.name}</span>
        <span class="plan-terms">${plan.terms}</span>
        <span class="card-medallion" aria-hidden="true"><svg viewBox="0 0 40 40">${cardMarks[plan.id]}</svg><i class="card-spark"></i><i class="card-spark"></i></span>
        <span class="card-pricing">
          <span class="card-price"><small>¥</small>${plan.price}</span>
          <span class="card-original">原价示例 <s>¥${plan.exampleOriginalPrice}</s></span>
        </span>
        <span class="plan-summary">${plan.summary}</span>
      </button>
    </div>`).join("");
  benefits.innerHTML = plans.map(plan => `
    <section class="details" id="panel-${plan.id}" role="tabpanel" hidden>
      ${visualPerks(plan)}
    </section>`).join("");
  byId("stage-pages").innerHTML = plans.map((plan, index) =>
    `<button type="button" id="stage-page-${index}" data-page="${index}" aria-label="${plan.name}"></button>`).join("");
  setCardLayout();
  updatePlans();
}

function setCardLayout() {
  cardWidth = version === "2" ? 51 : 65;
  cardStep = version === "2" ? 44 : 55;
  cardList.style.setProperty("--card-width", cardWidth + "%");
  cardList.style.setProperty("--card-overlap", (cardStep - cardWidth) + "%");
  cardList.style.marginLeft = ((100 - cardWidth) / 2) + "%";
}

function rotateCards(progress) {
  cardCopies.forEach((_, index) => {
    const side = Math.max(-1, Math.min(1, index - progress));
    const distance = Math.abs(side);
    const card = byId("head-" + index);
    card.parentElement.style.zIndex = String(3 - Math.round(distance * 2));
    card.style.setProperty("--turn", (-side * 30) + "deg");
    card.style.setProperty("--depth", (-distance * 57) + "px");
    card.style.setProperty("--lift", (distance * 8) + "px");
    card.style.setProperty("--fade", 1 - distance * .24);
  });
}

function updatePlans() {
  carousel.style.setProperty("--position", (-position * cardStep) + "%");
  carousel.setAttribute("data-active", plans[active].id);
  rotateCards(position);
  cardCopies.forEach((_, index) => {
    const head = byId("head-" + index);
    const selected = index === position;
    head.setAttribute("aria-selected", String(selected));
    head.setAttribute("aria-hidden", String(Math.abs(index - position) > 1));
    head.tabIndex = selected ? 0 : -1;
  });
  plans.forEach((plan, index) => {
    const panel = byId("panel-" + plan.id);
    panel.hidden = index !== active;
    byId("stage-page-" + index).setAttribute("aria-current", String(index === active));
    if (index === active) panel.setAttribute("aria-labelledby", "head-" + position);
  });
  const plan = plans[active];
  const owned = records.some(record => record.id === plan.id);
  const tierTitles = {vip:"VIP 等级特权", drama:"短剧畅享权益", supreme:"至尊双享权益"};
  byId("perk-title").textContent = version === "1" ? tierTitles[plan.id] : plan.id === "vip" ? "VIP 特权" : "套餐权益";
  byId("dock-name").textContent = plan.name + " · 已选择";
  byId("dock-amount").textContent = plan.price;
  byId("dock-savings").textContent = "立省" + (plan.exampleOriginalPrice - plan.price) + "元";
  buy.disabled = owned;
  buy.textContent = owned ? "已购买" : version === "2" ? "立即开通 ¥" + plan.price : "立即开通" + plan.name;
}

function recenterPlans() {
  const centered = centerStart + active;
  if (position === centered) return;
  const restoreFocus = document.activeElement === byId("head-" + position);
  carousel.classList.add("recentering");
  position = centered;
  updatePlans();
  // Apply the identical centered copy before restoring animated transitions.
  void cardList.offsetWidth;
  carousel.classList.remove("recentering");
  if (restoreFocus) byId("head-" + position).focus({preventScroll:true});
}

function selectPlan(target, focus = false) {
  const delta = target - position;
  if (target < 1 || target >= cardCopies.length - 1) {
    recenterPlans();
    target = position + delta;
  }
  position = target;
  active = position % plans.length;
  updatePlans();
  if (focus) byId("head-" + position).focus({preventScroll:true});
  clearTimeout(recenterTimer);
  recenterTimer = setTimeout(recenterPlans, 420);
}

cardList.addEventListener("keydown", event => {
  const toFirst = (plans.length - active) % plans.length;
  const toLast = (plans.length - 1 - active + plans.length) % plans.length;
  const nearest = offset => offset > plans.length / 2 ? offset - plans.length : offset;
  const target = {ArrowLeft:position-1, ArrowRight:position+1,
    Home:position+nearest(toFirst), End:position+nearest(toLast)}[event.key];
  if (target === undefined) return;
  event.preventDefault();
  selectPlan(target, true);
});

byId("stage-pages").addEventListener("click", event => {
  const page = event.target.closest("[data-page]");
  if (!page) return;
  const offset = (Number(page.dataset.page) - active + plans.length) % plans.length;
  selectPlan(position + (offset > plans.length / 2 ? offset - plans.length : offset));
});

let drag = null;
let suppressClick = false;
cardList.addEventListener("click", event => {
  if (suppressClick) return;
  const card = event.target.closest(".member-card");
  if (card) selectPlan(Number(card.dataset.index));
});
carousel.addEventListener("pointerdown", event => {
  if (!event.isPrimary || event.button !== 0 || event.target?.closest(".stage-pages")) return;
  clearTimeout(recenterTimer);
  suppressClick = false;
  drag = {id:event.pointerId, x:event.clientX, y:event.clientY, engaged:false};
});
carousel.addEventListener("pointermove", event => {
  if (!drag || event.pointerId !== drag.id) return;
  const dx = event.clientX - drag.x;
  const dy = event.clientY - drag.y;
  if (!drag.engaged) {
    if (Math.abs(dx) < 10 || Math.abs(dx) < Math.abs(dy)) return;
    drag.engaged = true;
    suppressClick = true;
    carousel.classList.add("dragging");
    carousel.setPointerCapture(drag.id);
  }
  const limit = carousel.clientWidth * cardStep / 100;
  const offset = Math.max(-limit, Math.min(limit, dx));
  carousel.style.setProperty("--drag", offset + "px");
  if (limit) rotateCards(position - offset / limit);
});

function finishDrag(event) {
  if (!drag || event.pointerId !== drag.id) return;
  const swipe = drag.engaged && event.type === "pointerup" ? event.clientX - drag.x : 0;
  drag = null;
  carousel.classList.remove("dragging");
  carousel.style.setProperty("--drag", "0px");
  if (Math.abs(swipe) >= 42) selectPlan(position + (swipe < 0 ? 1 : -1));
  else {
    rotateCards(position);
    recenterTimer = setTimeout(recenterPlans, 420);
  }
  setTimeout(() => { suppressClick = false; }, 0);
}

carousel.addEventListener("pointerup", finishDrag);
carousel.addEventListener("pointercancel", finishDrag);
carousel.addEventListener("lostpointercapture", finishDrag);
buy.addEventListener("click", () => {
  if (!buy.disabled) beginPayment(plans[active]);
});

const comparison = byId("comparison");
byId("compare-trigger").addEventListener("click", () => {
  const perks = new Set(plans.flatMap(plan => plan.perks));
  const columns = plans.map((plan, index) =>
    `<th scope="col" class="${index === active ? "current" : ""}">${plan.name}<small>¥${plan.price}</small></th>`).join("");
  const rows = [...perks].map(perk => {
    const cells = plans.map((plan, index) => {
      const included = plan.perks.includes(perk);
      return `<td class="${index === active ? "current" : ""}"><span ${included ? 'class="checkmark"' : ""} aria-label="${included ? "包含" : "未列出"}">${included ? "✓" : "—"}</span></td>`;
    }).join("");
    return `<tr><th scope="row">${perk}</th>${cells}</tr>`;
  }).join("");
  byId("comparison-content").innerHTML = `<table class="compare-table"><caption>✓ 表示套餐包含的权益</caption><thead><tr><th scope="col">权益</th>${columns}</tr></thead><tbody>${rows}</tbody></table>`;
  comparison.showModal();
});
byId("close-comparison").addEventListener("click", () => comparison.close());
comparison.addEventListener("click", event => {
  if (event.target === comparison) comparison.close();
});

function describe(plan, record) {
  if (plan.id === "monthly") {
    return (record.expiresAt > Date.now() ? "月卡到期时间 " : "月卡已到期 ") + dateLabel.format(record.expiresAt);
  }
  if (plan.id === "vip" || plan.id === "supreme") return "VIP 有效期 · 永久";
  return "购买方式 · 一次购买";
}

function accountCard(plan, record) {
  const status = plan.id === "monthly" && record.expiresAt <= Date.now() ? "已到期" :
    plan.id === "monthly" ? "月卡生效中" : "已购买";
  return `<article class="account-card">
    <div class="account-title"><h3>${plan.name}</h3><span class="pill">${status}</span></div>
    <p class="muted">${describe(plan, record)}</p>${perkList(plan)}
  </article>`;
}

function updateAccount() {
  const vip = records.some(record => record.id === "vip" || record.id === "supreme");
  const monthly = records.filter(record => record.id === "monthly");
  const hasMonth = monthly.some(record => record.expiresAt > Date.now());
  const hasDrama = records.some(record => record.id === "drama");
  let subtitle = "当前未开通会员";
  if (vip) subtitle = "VIP会员 · 永久有效";
  else if (hasDrama) subtitle = "已开通短剧畅享卡";
  else if (hasMonth) subtitle = "体验月卡生效中";
  else if (monthly.length) subtitle = "体验月卡已到期";

  const latest = records.findLast(record => record.id !== "monthly" || record.expiresAt > Date.now());
  const member = accountPlans.find(plan => plan.id === latest?.id);
  const expiration = {
    vip: "永久有效",
    supreme: "VIP 永久有效",
    drama: "待配置",
    monthly: latest?.id === "monthly" ? dateLabel.format(latest.expiresAt) : ""
  };
  byId("profile-heading").textContent = member?.name ?? "开通51短剧会员";
  byId("member-term").textContent = member ? "到期时间 · " + expiration[member.id] : "畅看更多精彩大片";
  byId("account-summary").textContent = subtitle + (monthly.length ? " · 累计赠送 " + monthly.length * 68 + " 金币" : "");
  byId("account-list").innerHTML = accountPlans.map(plan => {
    const record = records.findLast(item => item.id === plan.id);
    return record ? accountCard(plan, record) : "";
  }).join("");
  byId("reset").hidden = records.length === 0;
}

function updateCatalogTabs() {
  const showTabs = !byId("recharge-history").hidden;
  byId("catalog-tabs").hidden = !showTabs;
  byId("nav-title").hidden = showTabs;
  byId("member-tab").setAttribute("aria-pressed", String(!onCoins));
  byId("coin-tab").setAttribute("aria-pressed", String(onCoins));
  byId("dock-support").hidden = version !== "2";
}

function selectVersion(nextVersion) {
  if (version === nextVersion) return;
  version = nextVersion;
  device.setAttribute("data-version", version);
  byId("version-1").setAttribute("aria-pressed", String(version === "1"));
  byId("version-2").setAttribute("aria-pressed", String(version === "2"));
  carousel.classList.add("recentering");
  setCardLayout();
  updatePlans();
  void cardList.offsetWidth;
  carousel.classList.remove("recentering");
  const support = byId("dock-support-note");
  support.hidden = true;
  byId("dock-support-button").setAttribute("aria-expanded", "false");
  updateCatalogTabs();
}

byId("version-1").addEventListener("click", () => selectVersion("1"));
byId("version-2").addEventListener("click", () => selectVersion("2"));
byId("member-tab").addEventListener("click", () => {
  if (onCoins) showShop();
});
byId("coin-tab").addEventListener("click", () => {
  if (onCoins) return;
  shopScroll = viewport.scrollTop;
  onCoins = true;
  byId("shop").hidden = true;
  byId("coins").hidden = false;
  dock.hidden = true;
  viewport.scrollTop = 0;
  updateCatalogTabs();
});
byId("dock-support-button").addEventListener("click", () => {
  const note = byId("dock-support-note");
  note.hidden = !note.hidden;
  byId("dock-support-button").setAttribute("aria-expanded", String(!note.hidden));
});

function showDetail(section, title) {
  if (!onCoins) shopScroll = viewport.scrollTop;
  byId("shop").hidden = true;
  byId("coins").hidden = true;
  dock.hidden = true;
  byId("account").hidden = section !== "account";
  byId("history").hidden = section !== "history";
  byId("nav-title").textContent = title;
  byId("recharge-history").hidden = true;
  updateCatalogTabs();
  viewport.scrollTop = 0;
  byId(section + "-title").focus({preventScroll:true});
}

function showAccount() {
  updateAccount();
  showDetail("account", "我的权益");
}

function showHistory() {
  const items = records.toReversed().map(record => {
    const plan = accountPlans.find(item => item.id === record.id);
    const method = ["微信支付", "支付宝"].includes(record.method) ? record.method + " · " : "";
    const amount = Number.isFinite(record.amount) ? record.amount : plan.price;
    return `<article class="account-card">
      <div class="account-title"><h3>${plan.name}</h3><span class="record-price">¥${amount}</span></div>
      <p class="record-note">${dateLabel.format(record.paidAt)}</p>
      <p class="record-note">${method}模拟支付成功</p>
    </article>`;
  }).join("");
  byId("history-list").innerHTML = items || '<p class="record-note">暂无充值记录</p>';
  showDetail("history", "充值记录");
}

function showShop() {
  onCoins = false;
  byId("coins").hidden = true;
  byId("account").hidden = true;
  byId("history").hidden = true;
  byId("shop").hidden = false;
  dock.hidden = false;
  byId("nav-title").textContent = "会员中心";
  byId("recharge-history").hidden = false;
  updateCatalogTabs();
  viewport.scrollTop = shopScroll;
  byId("recharge-history").focus({preventScroll:true});
}

byId("recharge-history").addEventListener("click", showHistory);
byId("to-shop").addEventListener("click", showShop);
byId("back").addEventListener("click", () => {
  if (byId("shop").hidden) showShop();
  else showAccount();
});
byId("reset").addEventListener("click", () => {
  records = [];
  writeRecords();
  updatePlans();
  updateAccount();
  byId("to-shop").focus();
});

function beginPayment(plan) {
  pending = plan;
  byId("sheet-title").textContent = "确认购买";
  byId("payment").hidden = false;
  byId("success").hidden = true;
  byId("order-name").textContent = plan.name;
  byId("order-terms").textContent = plan.terms;
  byId("order-price").textContent = "¥" + plan.price;
  byId("confirm-pay").textContent = "模拟支付 ¥" + plan.price;
  byId("payment-support-message").hidden = true;
  byId("payment-support").setAttribute("aria-expanded", "false");
  checkout.querySelector('input[name="pay"]').checked = true;
  checkout.showModal();
  checkout.querySelector('input[name="pay"]').focus();
}

byId("payment-support").addEventListener("click", () => {
  const message = byId("payment-support-message");
  message.hidden = !message.hidden;
  byId("payment-support").setAttribute("aria-expanded", String(!message.hidden));
});

byId("confirm-pay").addEventListener("click", () => {
  if (!pending) return;
  const plan = pending;
  pending = null;
  const method = checkout.querySelector('input[name="pay"]:checked').value;
  const record = {id:plan.id, paidAt:Date.now(), method, amount:plan.price};
  records.push(record);
  writeRecords();
  updateAccount();
  byId("sheet-title").textContent = "模拟支付成功";
  byId("payment").hidden = true;
  byId("success").hidden = false;
  byId("result-name").textContent = plan.name + "已开通";
  byId("result-meta").textContent = method + " · ¥" + plan.price;
  byId("result-summary").innerHTML = accountCard(plan, record);
  byId("view-result").focus();
});

byId("close-sheet").addEventListener("click", () => checkout.close());
checkout.addEventListener("click", event => {
  if (event.target === checkout) checkout.close();
});
checkout.addEventListener("close", () => {
  pending = null;
  updatePlans();
});
byId("view-result").addEventListener("click", () => {
  checkout.close();
  showAccount();
});

renderPlans();
updateAccount();
updateCatalogTabs();
</script>
</body>
</html>
