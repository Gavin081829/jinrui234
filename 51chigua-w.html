const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function art(){return '<svg aria-hidden="true" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice"><use href="#landscape"/></svg>'}
function nav(){return `<nav class="bottom" aria-label="主导航">${[['home','fire','热点'],['video','play','视频'],['community','people','社区'],['chat','chat','聊天'],['mine','user','我的']].map(([p,i,t])=>`<button class="nav ${page===p?'active':''}" onclick="go('${p}')" ${page===p?'aria-current="page"':''}>${icon(i)}${t}</button>`).join('')}</nav>`}
function masthead(community=false){return `<header class="top"><div class="mast"><button class="logo" onclick="go('home')" aria-label="51吃瓜首页">51吃瓜</button><button class="search-pill" onclick="openSearch()">${icon('search')}<span>搜索感兴趣的内容</span></button>${community?'<button class="pink" onclick="go(\'compose\')">发帖</button>':''}</div></header>`}
function go(p){if(page==='compose')capture();page=p;playing=false;render()}
function deviceStatus(){return `<div class="device-status ${page==='video'?'dark':''}"><span>9:41</span><span class="signal">▂▄▆ ▰</span></div>`}
function homeIndicator(){return '<div class="home-indicator" aria-hidden="true"><i></i></div>'}
function render(){closeSheet();app.innerHTML=`<section class="screen ${page==='video'?'video-screen':''} ${page==='profile'?'profile-screen':''} ${collectionMode&&page==='video'?'collection-playing':''}">${deviceStatus()}${page==='home'?home():page==='community'?community():page==='compose'?compose():page==='search'?search():page==='video'?video():page==='profile'?profile():simple()}${['home','community','chat','mine'].includes(page)||(page==='video'&&!collectionMode)?nav():''}${homeIndicator()}</section>`;app.querySelectorAll('img[src^="assets/"]').forEach(img=>img.src=imageAssets[img.getAttribute('src').split('/').pop()]);if(page==='compose')bindForm();if(page==='video'){const player=document.getElementById('player');if(videoUrl){player.src=videoUrl;player.playbackRate=speed;player.addEventListener('ended',endedEpisode);if(playing)player.play().catch(()=>{playing=false;syncPlay()})}resetDanmaku();syncPlay()}if(page==='home')document.querySelector('#categories .active')?.scrollIntoView({block:'nearest',inline:'center'})}
function home(){let items=category==='推荐'?news:news.filter(n=>n[1]===category);return `${masthead()}<div class="tabs-shell"><button class="tab-arrow" aria-label="向左查看分类" onclick="scrollTabs(-1)">${icon('back')}</button><div class="tabs" id="categories" role="tablist">${categories.map(c=>`<button role="tab" aria-selected="${category===c}" class="tab ${category===c?'active':''}" onclick="chooseCategory(this,'${c}')">${c}</button>`).join('')}</div><button class="tab-arrow" aria-label="向右查看分类" onclick="scrollTabs(1)">${icon('next')}</button></div><div class="scroll" id="feed"><div class="section-label"><strong>发现新鲜事</strong><span class="subtle">每一刻，都值得分享</span></div>${newsCards(items)}</div>`}
function newsCards(items){return items.map((n,i)=>`<article class="news" tabindex="0" role="button" onclick="readArticle(${news.indexOf(n)})" onkeydown="if(event.key==='Enter')this.click()"><div class="news-text"><h3>${esc(n[0])}</h3><div class="meta"><span>${i+1}小时前</span><span>◯ ${18+i*7}</span><span>${n[2]}浏览</span></div></div><div class="thumb" style="filter:hue-rotate(${i*24}deg)">${art()}</div></article>`).join('')}
function scrollTabs(d){document.getElementById('categories').scrollBy({left:d*180,behavior:'smooth'})}
function chooseCategory(btn,c){category=c;document.querySelectorAll('#categories .tab').forEach(t=>{t.classList.toggle('active',t===btn);t.setAttribute('aria-selected',t===btn)});btn.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});document.getElementById('feed').innerHTML=`<div class="section-label"><strong>${c==='推荐'?'发现新鲜事':c}</strong><span class="subtle">每一刻，都值得分享</span></div>${newsCards(c==='推荐'?news:news.filter(n=>n[1]===c))}`}
function community(){return `${masthead(true)}<div class="scroll"><div class="banner"><div><h2>51广场</h2><p>有趣的生活，和有共鸣的人一起分享</p></div><span class="banner-symbol">✳</span></div><div class="tabs community-tabs">${['最新主题','一周热门','最新回复'].map(t=>`<button class="tab ${communityTab===t?'active':''}" onclick="communityTab='${t}';render()">${t}</button>`).join('')}</div>${(communityTab==='最新主题'?posts:[...posts].reverse()).map(postCard).join('')}</div>`}
function postCard(p){return `<article class="post"><div class="author"><button class="avatar" aria-label="查看个人中心" onclick="openProfile()">${esc(p.avatar)}</button><div><strong>${esc(p.user)}</strong><small>分享生活中的每一个小瞬间</small></div></div><h3>${esc(p.title)}</h3><p>${esc(p.body)}</p>${p.art?`<div class="cover">${art()}</div>`:''}<span class="tag"># ${esc(p.tag)}</span><div class="post-actions"><button onclick="this.textContent=this.dataset.on?'♡ 128':'♥ 129';this.dataset.on=this.dataset.on?'':'1'">♡ 128</button><button onclick="toast('来发一篇帖子，分享你的想法吧')">◯ 24</button><button onclick="shareLink()">↗ 分享</button></div></article>`}
function compose(){return `<header class="page-head"><button class="back" aria-label="返回社区" onclick="go('community')">${icon('back')}</button><h2>发布帖子</h2><button class="pink publish" id="publish" onclick="submitPost()">发布</button></header><form class="form" id="postForm" novalidate onsubmit="event.preventDefault();submitPost()"><p class="form-intro">分享你的新鲜事，让有趣的想法被看见。</p><div class="form-alert" id="formAlert" role="alert"></div><div class="field" id="titleField"><label for="title">帖子标题<span class="required">*</span></label><div class="field-box"><input id="title" required minlength="8" maxlength="60" aria-describedby="titleError titleCount" placeholder="请输入帖子标题（8～60字）" value="${esc(draft.title)}"><div class="counter" id="titleCount">${draft.title.length}/60</div></div><p class="error" id="titleError"></p></div><div class="field" id="bodyField"><label for="body">正文内容<span class="required">*</span></label><div class="field-box"><textarea id="body" required maxlength="5000" aria-describedby="bodyError" placeholder="分享你的故事、观点或发现…">${esc(draft.body)}</textarea></div><p class="error" id="bodyError">请填写正文内容</p></div><div class="field"><label>图片 / 视频<span class="optional">选填</span></label><button type="button" class="upload" onclick="document.getElementById('mediaFile').click()">${icon('plus')}<b id="fileName">${draft.file?esc(draft.file):'添加图片或视频'}</b><small>支持图片和 MP4 视频</small></button><input class="hidden" type="file" id="mediaFile" accept="image/*,video/mp4" onchange="pickMedia(this)"></div><div class="field" id="topicField"><label for="topicButton">话题<span class="required">*</span><span class="optional">至少选择 1 个，最多 3 个</span></label><div class="form-foot"><button type="button" class="ghost" id="topicButton" aria-describedby="topicError" aria-required="true" onclick="pickTopic()">＋ 话题 ${draft.topics.length}/3</button><button type="button" class="ghost" onclick="previewPost()">预览</button></div><p class="error" id="topicError">请至少选择 1 个话题</p><div id="topicList" class="subtle" style="margin-top:12px;color:#b47eab">${draft.topics.map(t=>'#'+esc(t)).join('　')}</div></div><p class="agreement">发布即表示同意 <button type="button" onclick="rules()">《51吃瓜帖子发布规范》</button></p></form>`}
function capture(){if(document.getElementById('title')){draft.title=document.getElementById('title').value;draft.body=document.getElementById('body').value}}
function bindForm(){['title','body'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{capture();if(id==='title')document.getElementById('titleCount').textContent=draft.title.length+'/60';if(formAttempted)validate(false)}));if(formAttempted)validate(false)}
function validate(focus){capture();const errors=[];if(draft.title.trim().length<8||draft.title.trim().length>60)errors.push(['title',draft.title.trim()?'标题需填写 8～60 个字':'请填写帖子标题（8～60字）']);if(!draft.body.trim())errors.push(['body','请填写正文内容']);if(draft.topics.length<1)errors.push(['topic','请至少选择 1 个话题']);['title','body','topic'].forEach(id=>{const e=errors.find(x=>x[0]===id);document.getElementById(id+'Field').classList.toggle('invalid',!!e);document.getElementById(id==='topic'?'topicButton':id).setAttribute('aria-invalid',!!e);if(e)document.getElementById(id+'Error').textContent=e[1]});let a=document.getElementById('formAlert');a.style.display=errors.length?'block':'none';a.textContent=errors.length?`还有 ${errors.length} 项内容需要补全，请检查标红的必填项。`:'';if(errors.length&&focus){document.getElementById(errors[0][0]==='topic'?'topicButton':errors[0][0]).focus();document.getElementById(errors[0][0]+'Field').scrollIntoView({behavior:'smooth',block:'center'})}return !errors.length}
function submitPost(){formAttempted=true;if(!validate(true))return;let btn=document.getElementById('publish');btn.disabled=true;btn.textContent='发布中';posts.unshift({title:draft.title.trim(),body:draft.body.trim(),user:'我',avatar:'我',tag:draft.topics[0]||'日常分享'});draft={title:'',body:'',topics:[],file:''};formAttempted=false;communityTab='最新主题';go('community');toast('发布成功，帖子已添加到当前演示社区')}
function pickMedia(input){const f=input.files[0];if(!f)return;if(!f.type.startsWith('image/')&&f.type!=='video/mp4'){toast('请选择图片或 MP4 视频');input.value='';return}draft.file=f.name;document.getElementById('fileName').textContent=f.name;toast('已选择文件（本地演示，不上传）')}
function pickTopic(){capture();showSheet('添加话题',`<p class="subtle">至少选择 1 个，最多 3 个话题，再次点击可取消</p><div class="speeds" style="grid-template-columns:repeat(2,1fr)">${['周末去哪儿','日常碎片','旅行记录','快乐分享','城市漫步','生活灵感'].map(t=>`<button class="speed ${draft.topics.includes(t)?'selected':''}" onclick="toggleTopic('${t}',this)">${t}</button>`).join('')}</div><button class="pink" style="width:100%;margin-top:20px" onclick="closeSheet()">完成</button>`)}
function toggleTopic(t,b){if(draft.topics.includes(t))draft.topics=draft.topics.filter(x=>x!==t);else if(draft.topics.length<3)draft.topics.push(t);else return toast('最多添加 3 个话题');b.classList.toggle('selected',draft.topics.includes(t));document.getElementById('topicButton').textContent='＋ 话题 '+draft.topics.length+'/3';document.getElementById('topicList').textContent=draft.topics.map(t=>'#'+t).join('　');if(formAttempted)validate(false)}
function previewPost(){capture();showSheet('帖子预览',`<div class="dialog-content"><h3 class="modal-title">${esc(draft.title||'尚未填写标题')}</h3>${esc(draft.body||'尚未填写正文')}</div>${draft.file?`<p class="subtle">已选附件：${esc(draft.file)}</p>`:''}`)}
function rules(){showSheet('帖子发布规范','<div class="dialog-content">请尊重他人，文明交流。\n请勿发布违法、侵权、虚假或泄露个人隐私的内容。\n标题应为 8～60 字，正文不能为空。\n话题至少选择 1 个，最多 3 个。\n图片、视频为选填内容。</div>')}
function openSearch(){query='';searchTab='总榜';go('search')}
function search(){return `<header class="search-top"><button class="back" aria-label="返回" onclick="go('home')">${icon('back')}</button><form class="search-entry" onsubmit="event.preventDefault();doSearch()">${icon('search')}<input id="searchInput" aria-label="搜索内容" value="${esc(query)}" placeholder="搜索感兴趣的内容">${query?`<button type="button" class="search-clear" aria-label="清空搜索" onclick="query='';searchTab='总榜';render()">×</button>`:''}<button class="search-go" type="submit">搜索</button></form></header><div class="scroll search-content">${!query?historyMarkup():''}<div class="tabs search-tabs" role="tablist">${(query?['全部','文章','视频','社区','用户']:['总榜','文章','视频','社区']).map(t=>`<button class="tab ${searchTab===t?'active':''}" role="tab" aria-selected="${searchTab===t}" onclick="searchTab='${t}';render()">${t}</button>`).join('')}</div>${query?results():ranks()}</div>`}
function historyMarkup(){return `<section class="search-history"><div class="history-heading"><strong>搜索历史</strong><button aria-label="清空搜索历史" onclick="searchHistory=[];render()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M9 6V3h6v3M6 6v15h12V6M10 10v7m4-7v7"/></svg></button></div><div class="history-chips">${searchHistory.length?searchHistory.map((h,i)=>`<div class="history-chip"><button onclick="searchFromHistory(${i})">${esc(h)}</button><button aria-label="删除历史记录 ${esc(h)}" onclick="searchHistory.splice(${i},1);render()">×</button></div>`).join(''):'<span class="history-empty">暂无搜索历史</span>'}</div></section>`}
function searchFromHistory(i){query=searchHistory[i];searchTab='全部';render()}
function doSearch(){query=document.getElementById('searchInput').value.trim();if(query)searchHistory=[query,...searchHistory.filter(h=>h!==query)].slice(0,8);searchTab=query?'全部':'总榜';render()}
function ranks(){let all=[...news,['在城市转角，发现一家宝藏咖啡馆','生活灵感','6120'],['和朋友一起，把周末过得有声有色','城市漫步','5980'],['记录今天的小确幸，分享生活的温度','快乐源泉','4830'],['出发吧，下一站去看海','视觉漫游','4260']];let list=searchTab==='视频'?all.filter((_,i)=>i%3===2):all;return `<div class="ranking-list">${list.map((n,i)=>`<button class="rank-row" onclick="query='${n[0]}';searchTab='全部';render()"><span class="number">${i+1}</span><span class="badge ${searchTab==='视频'||i%3===2?'video':''}">${searchTab==='文章'?'文章':searchTab==='视频'||i%3===2?'视频':'社区'}</span><span class="rank-title">${n[0]}</span><span class="views">${n[2]}浏览</span></button>`).join('')}</div>`}
function results(){let matched=news.filter(n=>n[0].includes(query)||n[1].includes(query));let mp=posts.filter(p=>p.title.includes(query)||p.body.includes(query));let count=searchTab==='社区'?mp.length:searchTab==='用户'?0:searchTab==='全部'?matched.length+mp.length:matched.length;return `<div class="result-note">“${esc(query)}” · ${count} 条相关结果</div>${!count?'<div class="empty">还没有找到相关内容<br><small>试试搜索「生活」「旅行」或「城市」</small></div>':searchTab==='社区'?mp.map(postCard).join(''):searchTab==='全部'?newsCards(matched)+mp.map(postCard).join(''):searchTab==='视频'?matched.map(n=>`<button class="rank-row" onclick="go('video')"><span class="badge video">视频</span><span class="rank-title">${esc(n[0])}</span>${icon('play')}</button>`).join(''):newsCards(matched)}`}
function video(){return `<header class="video-head">${collectionMode?`<button class="back" aria-label="返回视频页面" onclick="returnToVideoFeed()">${icon('back')}</button>`:''}<button class="search-pill" onclick="openSearch()">${icon('search')}<span>搜索感兴趣的视频</span></button>${!collectionMode?`<button class="add-video" aria-label="发布内容" onclick="go('compose')">${icon('plus')}</button>`:''}</header><div class="video-stage"><div class="danmaku-layer ${danmakuEnabled?'':'hidden'} ${playing?'':'paused'}" id="danmakuLayer" aria-hidden="true"><div class="danmaku-track" data-track="0"></div><div class="danmaku-track" data-track="1"></div></div><div class="film-frame"><img id="filmPoster" src="assets/${episode===67?'episode-67.jpg':'episode-cover.jpg'}" alt="雄霸商圈竖屏封面"><video id="player" class="${videoUrl?'':'hidden'}" playsinline></video>${!collectionMode?`<span class="film-title">《雄霸商圈》${episode}</span>`:''}</div><button class="play" id="playButton" aria-label="播放" onclick="togglePlay()">${icon('play')}</button><aside class="video-actions"><button class="creator-avatar" aria-label="查看大意草莓个人中心" onclick="openProfile()"><img src="assets/avatar.jpg" alt="大意草莓"><b>+</b></button><button aria-label="点赞" onclick="this.style.color='#ee3787';this.lastElementChild.textContent=this.lastElementChild.textContent==='0'?'1':'0'">${icon('like')}<span>0</span></button><button aria-label="喜欢" onclick="liked=!liked;this.style.color=liked?'#ee3787':'white';this.lastElementChild.textContent=liked?'1':'0'">${icon('heart')}<span>${liked?'1':'0'}</span></button><button aria-label="评论" onclick="videoComments()">${icon('chat')}<span>${getEpisodeComments(episode).length}</span></button><button aria-label="分享" onclick="shareLink()"><span style="font-size:33px;line-height:33px">➦</span></button><button class="more-icon" aria-label="更多" onclick="moreVideo()">${icon('more')}</button></aside><div class="video-caption"><h3><button onclick="openProfile()">@大意草莓</button></h3><p>《雄霸商圈》 ${episode}</p></div></div><div class="video-controls"><div class="progress"><i id="progressFill"></i></div></div><button class="collection-link" onclick="openEpisodes()">${icon('play')}<span>雄霸商圈·更新至第100集</span><span class="chevron" style="flex:none">›</span></button><span id="rateLabel" class="hidden">${speed}× · 默认高清</span><span id="videoTime" class="hidden"></span>`}
function returnToVideoFeed(){collectionMode=false;episode=67;elapsed=0;go('video')}
function syncPlay(){document.getElementById('danmakuLayer')?.classList.toggle('paused',!playing);const b=document.getElementById('playButton');if(!b)return;b.innerHTML=playing?'Ⅱ':icon('play');b.style.opacity=playing?'0.12':'.85';b.setAttribute('aria-label',playing?'暂停':'播放')}
function togglePlay(){playing=!playing;const v=document.getElementById('player');if(videoUrl){if(playing)v.play().catch(()=>{playing=false;syncPlay();toast('视频暂时无法播放，请重新选择 MP4 文件')});else v.pause()}syncPlay()}
function loadVideo(input){const f=input.files[0];if(!f)return;if(f.type!=='video/mp4')return toast('请选择 MP4 视频');if(videoUrl)URL.revokeObjectURL(videoUrl);videoUrl=URL.createObjectURL(f);elapsed=0;playing=false;render();toast('本地视频已载入，点击播放')}

function profileMore(){showSheet('更多操作',`<button class="sheet-row" onclick="shareLink()">分享个人主页 ↗</button>`)}
// Demo comments are scoped by episode; a service can replace this data source.
const episodeCommentStore={};
function getEpisodeComments(id){if(!episodeCommentStore[id]){const texts=[`第${id}集这个转折有点惊喜`,`第${id}集的对手戏真精彩`,`这一集的细节，值得再看一遍`,`这句台词我记住了`,`接着看第${id}集，剧情越来越有意思`,`这一段的节奏很舒服`];episodeCommentStore[id]=texts.map((text,i)=>({id:`${id}-${i}`,episodeId:id,text,user:['追剧日记','小岛','橘子汽水','一颗草莓','路过的观众','晚风'][i],createdAt:Date.UTC(2026,9,30,4,0)+id*60000+((i*7)%6)*60000}))}return episodeCommentStore[id].filter(c=>c.episodeId===id).slice().sort((a,b)=>b.createdAt-a.createdAt)}
function videoComments(){const comments=getEpisodeComments(episode);showSheet(`第${episode}集 · 评论`,comments.length?comments.map(c=>`<article class="episode-comment"><strong>${esc(c.user)}</strong><time>${new Date(c.createdAt).toLocaleTimeString('zh-CN',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit'})}</time><p>${esc(c.text)}</p></article>`).join('')+'<p class="subtle">演示评论 · 按评论时间从新到旧</p>':'<p class="comment-empty">本集暂无评论</p>')}
function resetDanmaku(){danmakuQueue=getEpisodeComments(episode);danmakuCursor=0;danmakuCooldown=[0,0];const layer=document.getElementById('danmakuLayer');if(!layer)return;layer.querySelectorAll('.danmaku-track').forEach(t=>t.innerHTML='');layer.classList.toggle('hidden',!danmakuEnabled);layer.classList.toggle('paused',!playing);if(danmakuEnabled&&playing)advanceDanmaku(0)}
function toggleDanmaku(button){danmakuEnabled=!danmakuEnabled;button.setAttribute('aria-checked',String(danmakuEnabled));resetDanmaku();toast(danmakuEnabled?'弹幕已开启，播放时展示':'弹幕已关闭')}
function advanceDanmaku(delta){if(!danmakuEnabled||!playing||page!=='video'||app.classList.contains('hidden'))return;const layer=document.getElementById('danmakuLayer');if(!layer)return;const tracks=layer.querySelectorAll('.danmaku-track');for(let lane=0;lane<2;lane++){danmakuCooldown[lane]=Math.max(0,danmakuCooldown[lane]-delta);if(danmakuCooldown[lane]>0||danmakuCursor>=danmakuQueue.length||!tracks[lane])continue;const comment=danmakuQueue[danmakuCursor++];const span=document.createElement('span');span.className='danmaku-text';span.textContent=comment.text;span.dataset.commentId=comment.id;tracks[lane].append(span);const containerWidth=layer.clientWidth||402,textWidth=span.offsetWidth||280;span.style.setProperty('--start-x',containerWidth+'px');span.style.setProperty('--flight-duration',(containerWidth+textWidth)/90+'s');danmakuCooldown[lane]=(textWidth+36)/90;span.addEventListener('animationend',()=>span.remove(),{once:true})}}
function profile(){return `<header class="profile-hero"><button class="back" aria-label="返回视频" onclick="go(profileReturn)">${icon('back')}</button><div class="profile-person"><img src="assets/avatar.jpg" alt="大意草莓头像"><h2>大意草莓</h2></div></header><div class="profile-body"><div class="profile-info"><div class="stats"><div><strong>${following?1:0}</strong><span>粉丝</span></div><div><strong>1</strong><span>关注</span></div><div><strong>84</strong><span>获赞</span></div></div><p class="profile-bio">大家好 我是大意草莓 感谢大家关注我 一起来讨论吧～</p><div class="profile-buttons"><button class="follow" onclick="following=!following;render()">${following?'已关注':'关注+'}</button><button class="friend" onclick="toast('好友申请已记录（本地演示）')">加好友</button><button class="dots" aria-label="用户更多操作" onclick="profileMore()">•••</button></div></div><nav class="profile-tabs" aria-label="个人中心分类">${['视频','社区','合集'].map(t=>`<button class="tab ${profileTab===t?'active':''}" onclick="profileTab='${t}';render()">${t}</button>`).join('')}</nav>${profileTab==='合集'?collectionCard():profileTab==='视频'?`<div class="profile-video-grid">${[1,2,3,4,5,6].map((e,i)=>`<button aria-label="播放第${e}集" onclick="playEpisode(${e})"><img src="assets/thumb-${i%4+1}.jpg" alt="第${e}集"><span>▶ ${[206,0,412,0,128,98][i]}</span></button>`).join('')}</div>`:'<div class="empty">还没有发布社区动态</div>'}</div>`}
function collectionCard(){return `<section class="collection-card"><div class="collection-card-head"><img src="assets/thumb-1.jpg" alt="雄霸商圈合集封面"><div class="info"><span class="badge">视频</span>雄霸商圈<p>2.2万观看 更新至第100集</p></div><button class="watch-now" onclick="playEpisode(1)">立即观看</button></div><div class="episode-strip">${[1,2,3,4].map((e,i)=>`<button class="episode-card" aria-label="播放第${e}集" onclick="playEpisode(${e})"><div class="episode-image"><img src="assets/thumb-${e}.jpg" alt=""><span>第${e}集</span></div><small>◉ ${[206,0,412,0][i]}人观看</small></button>`).join('')}</div><div class="episodes-heading"><span>共100集 · 按顺序播放</span><button onclick="openEpisodes()">查看全部 ›</button></div></section>`}
function playEpisode(e){episode=e;elapsed=0;collectionMode=true;page='video';playing=true;render();toast('正在播放第 '+e+' 集'+(videoUrl?' · 本地视频':' · 12秒进度演示'))}
function openEpisodes(){showSheet('雄霸商圈',`<div class="auto-next"><span>自动播放下一集</span><input type="checkbox" aria-label="自动播放下一集" ${autoNext?'checked':''} onchange="autoNext=this.checked"></div><div class="episodes-heading"><span>更新至第100集</span><span>当前第 ${episode} 集</span></div><div class="episode-grid">${Array.from({length:100},(_,i)=>`<button class="episode-choice ${episode===i+1?'current':''}" onclick="playEpisode(${i+1})">${i+1}</button>`).join('')}</div><div class="episode-bar"><span>无剧集视频源时为 12 秒进度演示</span><button onclick="nextEpisode()">下一集 ›</button></div>`)}

let lastFocus=null;
function showSheet(title,content){closeSheet();lastFocus=document.activeElement;let o=document.createElement('div');o.className='overlay';o.id='overlay';o.innerHTML=`<section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="handle"></div><div class="sheet-head"><h3>${title}</h3><button class="close" aria-label="关闭" onclick="closeSheet()">×</button></div>${content}</section>`;o.addEventListener('click',e=>{if(e.target===o)closeSheet()});app.append(o);o.querySelector('.close').focus()}
function closeSheet(){const o=document.getElementById('overlay');if(o){o.remove();if(lastFocus?.isConnected)lastFocus.focus()}}
document.addEventListener('keydown',e=>{const o=document.getElementById('overlay');if(!o)return;if(e.key==='Escape')closeSheet();if(e.key==='Tab'){const fs=[...o.querySelectorAll('button,input,textarea,a')];if(e.shiftKey&&document.activeElement===fs[0]){e.preventDefault();fs.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===fs.at(-1)){e.preventDefault();fs[0].focus()}}});
function toast(msg){document.getElementById('toast')?.remove();clearTimeout(toastTimer);const t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');t.textContent=msg;app.append(t);toastTimer=setTimeout(()=>t.remove(),3000)}
async function shareLink(){try{if(location.protocol==='file:')return toast('本地 HTML 演示，暂无线上分享链接');await navigator.clipboard.writeText(location.href);toast('链接已复制')}catch{toast('当前环境无法复制链接')}}
setInterval(()=>{if(page!=='video'||!playing||app.classList.contains('hidden'))return;advanceDanmaku(.25);const v=document.getElementById('player');let total=demoDuration;if(videoUrl){elapsed=v.currentTime;total=v.duration||demoDuration}else{elapsed+=speed*.25;if(elapsed>=demoDuration){endedEpisode();return}}document.getElementById('progressFill').style.width=(elapsed/total*100)+'%';document.getElementById('videoTime').textContent=fmt(elapsed)+' / '+fmt(total)},250);
function fmt(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(Math.floor(n%60)).padStart(2,'0')}
