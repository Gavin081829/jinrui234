<section class="about-hero"><div class="eyebrow">01 / 系统介绍 · ABOUT DER</div><h1>一站式办公协同<br>让<span>团队工作</span>更有序</h1><p>Der 是面向团队与企业的一体化办公协同系统。<br>将任务协同、云文档、云会议与 AI 助手汇聚在一个工作空间，<br>让沟通有承接、资料有沉淀、工作有进展。</p><div class="about-tags"><span>团队协作</span><span>知识共享</span><span>智能提效</span></div><div class="orbit"><div class="orbit-center">Der<span>●</span><small>连接人与工作的协作空间</small></div><div class="orbit-card c1">☑ <b>任务协同</b><small>分工明确，进展可见</small></div><div class="orbit-card c2">▤ <b>云文档</b><small>共同创作，知识共享</small></div><div class="orbit-card c3">▣ <b>云会议</b><small>跨越距离，沟通同频</small></div><div class="orbit-card c4">✧ <b>AI 助手</b><small>辅助思考，提升效率</small></div></div></section>
<section class="values about-problems"><div class="wrap"><div class="sectiontitle"><div class="eyebrow">02 / 我们能解决什么问题</div><h2>把协作中的阻力，变成向前的动力</h2><p>从日常工作出发，让分散的信息、任务与团队重新连接。</p></div><div class="valuegrid"><article><div class="valueicon">☷</div><span>信息分散 · 反复切换</span><h3>工作信息，集中协同</h3><p>任务、文档和会议散落在不同工具中，查找和沟通费时。Der 将常用协作能力汇聚在一个平台，减少来回切换。</p><div class="problem-result">让信息更集中，协作更顺畅</div></article><article><div class="valueicon">☑</div><span>分工模糊 · 进展难追踪</span><h3>责任清晰，推进有序</h3><p>任务靠口头交接，容易遗漏责任与时间节点。通过负责人、截止时间和任务状态，让团队了解谁在做、做到哪一步。</p><div class="problem-result">让每项工作都有明确承接</div></article><article><div class="valueicon">▤</div><span>资料难找 · 经验难复用</span><h3>共同创作，积累知识</h3><p>文件版本分散，经验停留在个人手中。通过云文档协作、共享与版本留痕，让团队资料持续积累，便于后续查阅和复用。</p><div class="problem-result">让个人经验成为团队积累</div></article><article><div class="valueicon">✧</div><span>沟通反复 · 重复整理</span><h3>减少重复，专注重点</h3><p>讨论缺少共同资料，内容整理占用精力。结合云会议、共享文档与 AI 辅助，让沟通有上下文，让内容提炼更轻松。</p><div class="problem-result">把更多时间留给有效工作</div></article></div></div></section>
<section class="about-services wrap"><div class="sectiontitle"><div class="eyebrow">03 / 我们的服务</div><h2>围绕团队日常，提供一体化协作服务</h2><p>从工作安排、资料共创，到线上沟通与智能辅助，支持团队的每一步协作。</p></div><div class="servicegrid"><article><div class="valueicon">☑</div><div><span>任务协同服务</span><h3>从目标拆解到进度跟进</h3><p>以任务清单组织工作，明确成员分工与时间节点；通过列表、看板等视图，帮助团队安排工作、掌握进展。</p><div class="service-tags"><span>任务清单</span><span>成员分工</span><span>进度管理</span></div></div></article><article><div class="valueicon">▤</div><div><span>文档与知识协作服务</span><h3>从共同编辑到经验沉淀</h3><p>围绕方案、项目资料和工作记录开展文档共创，通过共享与版本管理，让信息及时传递，让知识持续积累。</p><div class="service-tags"><span>云端文档</span><span>协同编辑</span><span>版本留痕</span></div></div></article><article><div class="valueicon">▣</div><div><span>在线会议服务</span><h3>让不同地点的团队保持同频</h3><p>以云会议支持远程讨论、项目沟通与团队协作，围绕共同目标交流信息、对齐思路，让讨论更贴近实际工作。</p><div class="service-tags"><span>线上沟通</span><span>远程协作</span><span>共识对齐</span></div></div></article><article><div class="valueicon">✧</div><div><span>AI 辅助办公服务</span><h3>让智能辅助融入日常工作</h3><p>围绕信息提炼、内容创作与工作思考提供 AI 辅助，帮助团队整理思路、提升内容处理效率，释放更多创造空间。</p><div class="service-tags"><span>信息提炼</span><span>创作辅助</span><span>工作提效</span></div></div></article></div></section>
<section class="about-contact" id="about-contact"><div class="wrap"><div class="sectiontitle"><div class="eyebrow">04 / 联系我们</div><h2>从一次交流，开始更好的协作</h2><p>无论是了解产品、讨论团队需求，还是咨询使用问题，我们期待与你沟通。</p></div><div class="contactgrid"><article><span class="contact-symbol">↗</span><h3>产品与方案咨询</h3><p>了解 Der 产品能力，沟通团队规模、工作场景与协作需求，探索适合团队的使用方式。</p><div class="contact-detail"><span>联系电话</span><b class="contact-placeholder">待补充</b></div></article><article><span class="contact-symbol">✉</span><h3>使用支持与意见反馈</h3><p>交流使用过程中遇到的问题，反馈产品建议，帮助我们持续改善团队的协作体验。</p><div class="contact-detail"><span>联系邮箱</span><b class="contact-placeholder">待补充</b></div></article></div><div class="contact-end"><span>先体验，再发现团队协作的更多可能。</span><a class="primary" href="#download">下载 Der，开启协作 <span>↗</span></a></div></div></section>

function addDownloadNotes(){
 const entries=[['.sidebar-download',1,'Web 侧边栏下载Der入口','点击“下载Der”，跳转至 Der 官网下载页，查看并选择对应终端。'],['.task-download-entry',2,'H5 任务页下载Der入口','点击任务顶部的“下载Der”，跳转至 Der 官网 H5 下载页，保留移动端展示。'],['.settings-download-banner',3,'H5 设置页下载Der横幅','点击“下载Der”横幅或“前往下载”，跳转至 Der 官网 H5 下载页。横幅文案为“下载 Der · 一站式办公协同软件 · 前往下载”。']];
 for(const [selector,id,title,description] of entries){const target=document.querySelector(selector);if(!target)continue;const marker=document.createElement('span');marker.className='download-note-marker';marker.textContent=id;marker.dataset.downloadNote=description;marker.dataset.noteTitle=title;marker.setAttribute('role','button');marker.setAttribute('tabindex','0');marker.setAttribute('aria-label',`查看第${id}项说明：${title}`);marker.title='点击查看：跳转官网下载页';target.appendChild(marker);}
}
let downloadNoteOrigin=null;
function closeDownloadNote(){const panel=document.querySelector('#download-note-panel');if(panel)panel.remove();if(downloadNoteOrigin&&downloadNoteOrigin.isConnected)downloadNoteOrigin.focus();downloadNoteOrigin=null;}
function showDownloadNote(marker){const existing=document.querySelector('#download-note-panel');if(existing)existing.remove();downloadNoteOrigin=marker;const panel=document.createElement('aside');panel.id='download-note-panel';panel.setAttribute('role','dialog');panel.setAttribute('aria-labelledby','download-note-title');const head=document.createElement('div');head.className='download-note-head';const heading=document.createElement('h2');heading.id='download-note-title';heading.textContent=marker.textContent+' · '+marker.dataset.noteTitle;const close=document.createElement('button');close.className='download-note-close';close.type='button';close.textContent='×';close.setAttribute('aria-label','关闭下载入口说明');head.append(heading,close);const text=document.createElement('p');text.textContent=marker.dataset.downloadNote;const foot=document.createElement('small');foot.textContent='点击序号查看说明；点击下载入口跳转官网下载页。';panel.append(head,text,foot);document.body.appendChild(panel);close.focus();}
document.addEventListener('click',e=>{const marker=e.target.closest('[data-download-note]');if(marker){e.preventDefault();e.stopImmediatePropagation();showDownloadNote(marker);return;}if(e.target.closest('.download-note-close')){closeDownloadNote();return;}if(!e.target.closest('#download-note-panel')){const panel=document.querySelector('#download-note-panel');if(panel)panel.remove();downloadNoteOrigin=null;}},true);
document.addEventListener('keydown',e=>{const marker=e.target.closest('[data-download-note]');if(marker&&(e.key==='Enter'||e.key===' ')){e.preventDefault();showDownloadNote(marker);}if(e.key==='Escape')closeDownloadNote();});

document.addEventListener('click',e=>{const m=e.target.closest('[data-mode]');if(m){site.classList.toggle('h5',m.dataset.mode==='h5');document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('selected',b===m));}const p=e.target.closest('[data-page]');if(p)location.hash=p.dataset.page;const mobilePage=e.target.closest('[data-mobile-page]');if(mobilePage){workspaceTab=mobilePage.dataset.mobilePage;render('workspace');}if(e.target.closest('[data-h5-download]')){site.classList.add('h5');document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('selected',b.dataset.mode==='h5'));}if(e.target.closest('.hamburger'))document.querySelector('#mobilemenu').hidden=false;if(e.target.closest('.closemenu'))document.querySelector('#mobilemenu').hidden=true;});window.addEventListener('hashchange',()=>render(['home','about','download','workspace'].includes(location.hash.slice(1))?location.hash.slice(1):'home'));render(location.hash.slice(1)||'home');
</script></body></html>
