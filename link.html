<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>渠道管理 Demo</title>
<style>
:root{--teal:#10b7a5;--teal-dark:#117c77;--ink:#172538;--muted:#8290a4;--border:#e0e5ed;--bg:#f0f2f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Arial,"Microsoft YaHei",sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-color:var(--teal)}button{cursor:pointer}button{border:1px solid #ced6e3;background:#fff;color:#40546e;border-radius:6px;padding:9px 15px;white-space:nowrap;transition:.18s}button:hover{border-color:var(--teal);color:var(--teal-dark)}button.primary{background:var(--teal);border-color:var(--teal);color:#fff}button.primary:hover{background:#0c9f91}.sidebar{position:fixed;inset:0 auto 0 0;width:208px;background:#202b3a;color:#fff;padding:0 12px;z-index:20}.brand{height:42px;display:flex;align-items:center;color:#a4b2c4;font-size:12px}.nav-title{font-weight:bold;display:flex;justify-content:space-between;padding:14px 0 20px}.nav-button{width:100%;text-align:left;background:none;border:0;color:#9baec3;padding:13px 17px;margin:2px 0;border-radius:6px}.nav-button.active{background:#374353;color:#fff}.nav-button:hover{background:#303c4c;color:#fff}.side-foot{position:absolute;bottom:22px;left:26px;font-size:11px;color:#788a9f}.main{margin-left:208px;padding:24px;min-height:100vh}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px;gap:12px}.top-note{color:#94a0b0;font-size:12px;display:flex;align-items:center;gap:8px}.live-dot{height:6px;width:6px;background:var(--teal);border-radius:100%}.page-title{font-size:21px;margin:0 0 21px;font-weight:600}.panel{background:white;border:1px solid var(--border);border-radius:9px}.filters{padding:14px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}input,select,textarea{padding:9px 11px;border:1px solid #ccd5e2;border-radius:6px;background:#fff;color:#35465e;min-width:0}input::placeholder,textarea::placeholder{color:#8a97a8}input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 2px #10b7a510}.filters input[type=search]{width:170px}.filters select{min-width:140px}.filters .code-select{width:270px}.date-separator{color:#96a0ae}.stats-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:14px}.stat{padding:17px 16px 19px;min-height:96px}.stat-label{font-size:12px;color:var(--muted);margin-bottom:13px}.stat-value{font-size:25px;color:#102135;letter-spacing:-.6px}.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:28px}.chart-panel{padding:16px}.panel-heading{font-size:14px;font-weight:500;margin:0}.chart-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.legend{display:flex;gap:12px;color:#8a96a6;font-size:11px}.legend span{display:flex;align-items:center;gap:5px}.legend i{width:7px;height:7px;border-radius:2px}.chart{height:180px;background:#fafafa;border-radius:6px;position:relative;overflow:hidden}.chart svg{width:100%;height:100%;display:block}.detail-panel{padding:17px 16px 14px}.detail-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}.update{font-size:12px;color:#99a4b4}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:13px;text-align:left}th{background:#f8f9fb;font-weight:400;color:#6f819b;padding:14px 8px;border-bottom:1px solid #edf0f4}td{padding:14px 8px;border-bottom:1px solid #edf0f4;color:#304963}tbody tr:hover{background:#fbfdfd}tbody tr:last-child td{border-bottom:0}.empty{text-align:center!important;color:#94a0b0;padding:42px!important}.config-panel{padding:14px 16px}.config-table{min-width:1080px}.config-table td{padding:15px 8px}.status{font-size:12px;border-radius:20px;background:#e6f7f3;color:#329587;padding:4px 9px}.status.disabled{background:#eff1f4;color:#8490a2}.text-btn{background:none;border:0;padding:3px 7px;color:#178e8b;font-size:13px}.text-btn.danger{color:#b87853}.url{max-width:260px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:middle;color:#6b7d91}.copy{font-size:12px;border:0;background:none;color:#14998e;padding:3px 7px}.table-footer{display:flex;align-items:center;justify-content:space-between;color:#94a0b0;font-size:12px;padding-top:18px}.page-no{border:1px solid var(--teal);color:var(--teal);padding:5px 9px;border-radius:4px}.hidden{display:none!important}.overlay{position:fixed;inset:0;z-index:50;background:#17213179;display:flex;align-items:center;justify-content:center;padding:24px}.modal{width:480px;max-width:100%;background:white;border-radius:11px;padding:22px 20px 18px;box-shadow:0 25px 55px #18212d26;max-height:calc(100vh - 36px);overflow-y:auto}.modal-title{font-size:16px;font-weight:500;margin:0 0 18px}.form-field{margin-bottom:16px}.form-field label{display:block;font-size:13px;color:#40566e;margin-bottom:7px}.required{color:var(--teal);margin-left:3px}.form-field input,.form-field select,.form-field textarea{width:100%;padding:11px}.form-field textarea{resize:vertical;min-height:65px}.hint{font-size:12px;color:#96a2b1;line-height:1.6;margin-top:6px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}.toast{position:fixed;bottom:30px;left:calc(50% + 104px);transform:translateX(-50%);background:#233448;color:white;box-shadow:0 6px 28px #1b2c3830;border-radius:7px;padding:12px 22px;z-index:100;font-size:13px}.form-error{color:#cf5d4b;font-size:12px;margin:6px 0}.mobile-menu{display:none}.config-search{width:220px!important}.muted{color:#94a0b0}
@media(min-width:1550px){.filters .code-select{width:320px}.stat{min-height:96px}.chart{height:180px}}@media(max-width:1200px){.stats-grid{grid-template-columns:repeat(5,minmax(0,1fr))}.main{padding:20px}.legend{gap:7px}.filters .code-select{width:180px}.stat-value{font-size:23px}.top-note{display:none}}@media(max-width:850px){.sidebar{width:165px}.main{margin-left:165px;padding:16px}.stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.chart-grid{grid-template-columns:1fr}.toast{left:50%}.chart{height:190px}.filters input[type=search]{flex:1}.detail-heading{align-items:flex-start;flex-direction:column}}@media(max-width:560px){.sidebar{width:100%;height:54px;bottom:auto;display:flex;align-items:center;gap:6px;padding:0 8px}.brand,.nav-title,.side-foot{display:none}.nav-button{width:auto;padding:10px 14px}.main{margin-left:0;padding:70px 12px 20px}.filters input[type=date]{width:calc(50% - 20px);flex:1}.filters select,.filters .code-select{width:100%;flex:1}.filters input[type=search]{width:100%}.stat{padding:15px;min-height:90px}.chart-panel{padding:13px}.update{font-size:11px}.modal{padding:20px}.legend{font-size:10px}.page-title{font-size:20px}}
</style>
</head>
<body>
<aside class="sidebar"><div class="brand">渠道管理 Demo</div><div class="nav-title">渠道管理 <span style="font-size:10px">▾</span></div><nav aria-label="主导航"><button class="nav-button" data-page="config">渠道配置</button><button class="nav-button active" data-page="stats">渠道统计</button></nav><div class="side-foot">DEMO · 本地演示数据</div></aside>
<main class="main">
<section id="stats-page">
<header class="topbar"><h1 class="page-title" style="margin:0">渠道统计</h1><div class="top-note"><i class="live-dot"></i>渠道数据概览 <span> / </span> 演示环境</div></header>
<form id="stats-filter" class="panel filters"><input id="stats-channel" type="search" placeholder="搜索渠道名" aria-label="搜索渠道名"><input id="stats-agent" type="search" placeholder="搜索代理名" aria-label="搜索代理名"><select id="stats-code" class="code-select" aria-label="推广码"><option value="">全部推广码</option></select><input id="start-date" type="date" value="2026-10-17" aria-label="开始日期"><span class="date-separator">至</span><input id="end-date" type="date" value="2026-10-23" aria-label="结束日期"><button class="primary" type="submit">查询</button><button id="export" type="button">导出明细</button></form>
<div id="metrics" class="stats-grid"></div>
<div class="chart-grid"><article class="panel chart-panel"><div class="chart-title"><h2 class="panel-heading">访问趋势（PV / UV）</h2><div class="legend"><span><i style="background:#10b7a5"></i>PV</span><span><i style="background:#75859b"></i>UV</span></div></div><div id="trend-chart" class="chart" role="img" aria-label="PV和UV访问趋势"></div></article><article class="panel chart-panel"><div class="chart-title"><h2 class="panel-heading">转化对比（下载 / 打开 / 注册）</h2><div class="legend"><span><i style="background:#10b7a5"></i>下载</span><span><i style="background:#117c77"></i>打开</span><span><i style="background:#91e9db"></i>注册</span></div></div><div id="conversion-chart" class="chart" role="img" aria-label="下载、打开和注册对比"></div></article></div>
<section class="panel detail-panel"><div class="detail-heading"><h2 class="panel-heading" id="detail-title">渠道明细</h2><span class="update">最近汇总：2026-10-23 12:00</span></div><div class="table-wrap"><table style="min-width:1370px"><thead><tr><th>推广码</th><th>渠道名</th><th>代理名</th><th>PV</th><th>UV</th><th>下载点击人数</th><th>首次打开</th><th>注册</th><th>注册转化率</th><th>首充人数</th><th>首充率</th><th>首充金额</th><th>付费人数</th><th>付费金额</th></tr></thead><tbody id="stats-body"></tbody></table></div></section>
<p class="hint" style="text-align:right;margin-top:12px">演示数据 · 注册转化率 = 注册 / UV，首充率 = 首充人数 / 注册</p>
</section>
<section id="config-page" class="hidden"><h1 class="page-title">渠道配置</h1><form id="config-filter" class="panel filters"><input id="config-keyword" class="config-search" type="search" placeholder="渠道 / 代理 / 推广码" aria-label="渠道、代理或推广码"><select id="config-status" aria-label="状态"><option value="">全部状态</option><option value="1">启用</option><option value="0">停用</option></select><button class="primary" type="submit">查询</button><button class="primary" type="button" id="new-channel">新建渠道</button></form><section class="panel config-panel"><div class="table-wrap"><table class="config-table"><thead><tr><th>编号</th><th>渠道名称</th><th>代理名称</th><th>推广码</th><th>推广地址</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead><tbody id="config-body"></tbody></table></div><div class="table-footer"><span id="row-count"></span><span class="page-no">1</span></div></section><p class="hint" style="margin-top:12px">新建及编辑的渠道保存在当前浏览器；渠道统计使用演示数据。</p></section>
</main>
<div id="modal-overlay" class="overlay hidden"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h2 id="modal-title" class="modal-title">新建渠道</h2><form id="channel-form"><div class="form-field"><label for="form-channel">渠道名称<span class="required">*</span></label><input id="form-channel" list="channel-options" maxlength="40" placeholder="手填，可从已有名称中选" required><datalist id="channel-options"><option>Twitter</option><option>Telegram</option><option>X</option></datalist></div><div class="form-field"><label for="form-agent">代理名称<span class="required">*</span></label><input id="form-agent" list="agent-options" maxlength="40" placeholder="手填，可从已有名称中选" required><datalist id="agent-options"><option>Twitter01</option><option>TG官方01</option><option>X投放02</option><option>APP投放01</option></datalist></div><div class="form-field"><label for="form-note">备注</label><textarea id="form-note" maxlength="300" placeholder="可选"></textarea></div><p id="form-error" class="form-error hidden"></p><div class="modal-actions"><button type="button" id="cancel-modal">取消</button><button class="primary" type="submit">确定</button></div></form></section></div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
'use strict';
const $=id=>document.getElementById(id),esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial=[{id:1,channel:'Twitter',agent:'Twitter01',code:'t7m4k2x',enabled:true,created:'2026-10-18 10:12:03',note:''},{id:2,channel:'Telegram',agent:'TG官方01',code:'a2k9plqx',enabled:true,created:'2026-10-19 14:22:11',note:''},{id:3,channel:'X',agent:'X投放02',code:'x3n8v6r',enabled:false,created:'2026-10-20 09:01:45',note:''},{id:4,channel:'Twitter',agent:'APP投放01',code:'p8w2kd1a',enabled:true,created:'2026-10-21 11:08:00',note:''}];
let channels=initial.map(x=>({...x}));try{const saved=JSON.parse(localStorage.getItem('channel-demo-v1'));if(Array.isArray(saved)&&saved.every(x=>x&&typeof x.code==='string'&&typeof x.channel==='string'&&typeof x.agent==='string'))channels=saved.map(({product,...channel})=>channel)}catch(e){}
const facts={'a2k9plqx':[1860,920,410,280,96,18,1260,42,5680],'p8w2kd1a':[980,510,220,150,48,9,540,20,2100],'t7m4k2x':[1520,810,350,230,75,12,840,32,3260],'x3n8v6r':[760,390,180,110,32,5,300,14,1080]};
let filteredStats=[],editingId=null,lastFocus=null,toastTimer;
const ratio=(a,b)=>b?(a/b*100).toFixed(1)+'%':'0.0%';
const url=c=>'https://demo.example.com/?code='+encodeURIComponent(c.code);
function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),2800)}
function save(){try{localStorage.setItem('channel-demo-v1',JSON.stringify(channels))}catch(e){toast('已更新；当前浏览器不支持本地保存')}}
function refreshCodes(){const val=$('stats-code').value;$('stats-code').innerHTML='<option value="">全部推广码</option>'+channels.map(c=>`<option value="${esc(c.code)}">${esc(c.code)} · ${esc(c.channel)}</option>`).join('');$('stats-code').value=val}
function statsRows(){const start=$('start-date').value,end=$('end-date').value;if(!start||!end){toast('请选择完整日期范围');return null}if(start>end){toast('开始日期不能晚于结束日期');return null}const day=86400000,a=Date.parse(start+'T00:00:00Z'),b=Date.parse(end+'T00:00:00Z'),lo=Date.parse('2026-10-17T00:00:00Z'),hi=Date.parse('2026-10-23T00:00:00Z');const overlap=Math.max(0,(Math.min(b,hi)-Math.max(a,lo))/day+1),factor=Math.min(7,overlap)/7;return channels.filter(c=>c.channel.toLowerCase().includes($('stats-channel').value.trim().toLowerCase())&&c.agent.toLowerCase().includes($('stats-agent').value.trim().toLowerCase())&&(!$('stats-code').value||c.code===$('stats-code').value)).map(c=>({...c,values:(facts[c.code]||Array(9).fill(0)).map(v=>Math.round(v*factor))}))}
function renderStats(notify=false){const rows=statsRows();if(rows===null)return;filteredStats=rows;const sums=Array(9).fill(0);rows.forEach(c=>c.values.forEach((v,i)=>sums[i]+=v));const [pv,uv,dl,open,reg,first,firstAmount,paid,amount]=sums;const metrics=[['PV',pv],['UV',uv],['下载点击人数',dl],['首次打开',open],['注册 / 转化率',reg+' / '+ratio(reg,uv)],['首充人数',first],['首充金额',firstAmount],['付费人数',paid],['付费金额',amount],['首充率',ratio(first,reg)]];$('metrics').innerHTML=metrics.map(([label,value])=>`<article class="panel stat"><div class="stat-label">${label}</div><div class="stat-value">${value}</div></article>`).join('');$('detail-title').textContent='渠道明细';$('stats-body').innerHTML=rows.length?rows.map(c=>{const [p,u,d,o,r,f,fa,pa,a]=c.values;return '<tr>'+[c.code,c.channel,c.agent,p,u,d,o,r,ratio(r,u),f,ratio(f,r),fa,pa,a].map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>'}).join(''):'<tr><td colspan="14" class="empty">暂无匹配的渠道数据</td></tr>';renderCharts(rows,sums);if(notify)toast('已更新查询结果')}
function renderCharts(rows,sums){const has=sums[0]>0;const seq=[.13,.20,.33,.27,.53,.67,.83,.73],seq2=[.05,.08,.11,.14,.20,.29,.42,.36];const points=arr=>arr.map((v,i)=>(120+i*48)+','+(155-(has?v:0)*135)).join(' ');$('trend-chart').innerHTML=`<svg viewBox="0 0 700 180" preserveAspectRatio="xMidYMid meet"><title>所选渠道访问趋势示意，PV ${sums[0]}，UV ${sums[1]}</title><polyline points="${points(seq)}" fill="none" stroke="#10b7a5" stroke-width="1.8"/><polyline points="${points(seq2)}" fill="none" stroke="#6e8098" stroke-width="1.8"/>${has?'':'<text x="350" y="90" text-anchor="middle" fill="#98a3b1" font-size="12">当前日期范围暂无数据</text>'}</svg>`;const max=Math.max(1,...rows.map(c=>c.values[2]));const n=Math.max(1,rows.length),gap=Math.min(165,560/n),bw=Math.min(28,gap/5);$('conversion-chart').innerHTML=`<svg viewBox="0 0 700 180"><title>各渠道下载、首次打开、注册人数对比</title>${rows.map((c,i)=>{const center=350+(i-(n-1)/2)*gap;return c.values.slice(2,5).map((v,j)=>{const h=v/max*120;return `<rect x="${center+(j-1)*(bw+9)-bw/2}" y="${150-h}" width="${bw}" height="${h}" fill="${['#10b7a5','#117c77','#95eddf'][j]}"><title>${esc(c.channel)} · ${['下载','打开','注册'][j]}：${v}</title></rect>`}).join('')+`<text x="${center}" y="170" text-anchor="middle" fill="#98a3b1" font-size="10">${esc(c.channel)}</text>`}).join('')}${has?'':'<text x="350" y="90" text-anchor="middle" fill="#98a3b1" font-size="12">暂无转化数据</text>'}</svg>`}
function renderConfig(){const q=$('config-keyword').value.trim().toLowerCase(),s=$('config-status').value;const rows=channels.filter(c=>(!q||[c.channel,c.agent,c.code].some(v=>v.toLowerCase().includes(q)))&&(s===''||c.enabled===(s==='1')));$('config-body').innerHTML=rows.length?rows.map(c=>`<tr><td>${c.id}</td><td>${esc(c.channel)}</td><td>${esc(c.agent)}</td><td>${esc(c.code)}</td><td><span class="url" title="${esc(url(c))}">${esc(url(c))}</span><button class="copy" data-action="copy" data-id="${c.id}" aria-label="复制推广地址">复制</button></td><td><span class="status ${c.enabled?'':'disabled'}">${c.enabled?'启用':'停用'}</span></td><td>${esc(c.created)}</td><td><button class="text-btn" data-action="edit" data-id="${c.id}">编辑</button><button class="text-btn ${c.enabled?'danger':''}" data-action="toggle" data-id="${c.id}">${c.enabled?'停用':'启用'}</button></td></tr>`).join(''):'<tr><td class="empty" colspan="8">暂无匹配的渠道，试试调整筛选条件</td></tr>';$('row-count').textContent='共 '+rows.length+' 条记录'}
function openModal(id=null){lastFocus=document.activeElement;editingId=id;$('channel-form').reset();$('form-error').classList.add('hidden');const c=channels.find(x=>x.id===id);$('modal-title').textContent=c?'编辑渠道':'新建渠道';if(c){$('form-channel').value=c.channel;$('form-agent').value=c.agent;$('form-note').value=c.note||''}$('modal-overlay').classList.remove('hidden');setTimeout(()=>$('form-channel').focus(),0)}
function closeModal(){$('modal-overlay').classList.add('hidden');lastFocus?.focus()}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x===b));$('stats-page').classList.toggle('hidden',b.dataset.page!=='stats');$('config-page').classList.toggle('hidden',b.dataset.page!=='config');if(b.dataset.page==='config')renderConfig()}));
$('stats-filter').addEventListener('submit',e=>{e.preventDefault();renderStats(true)});$('config-filter').addEventListener('submit',e=>{e.preventDefault();renderConfig();toast('已更新查询结果')});$('new-channel').addEventListener('click',()=>openModal());$('cancel-modal').addEventListener('click',closeModal);$('modal-overlay').addEventListener('click',e=>{if(e.target===$('modal-overlay'))closeModal()});
document.addEventListener('keydown',e=>{if($('modal-overlay').classList.contains('hidden'))return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const list=$('modal-overlay').querySelectorAll('input,select,textarea,button'),first=list[0],last=list[list.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
$('channel-form').addEventListener('submit',e=>{e.preventDefault();const ch=$('form-channel').value.trim(),ag=$('form-agent').value.trim(),note=$('form-note').value.trim();let error='';if(!ch||!ag)error='请填写渠道名称和代理名称';else if(channels.some(c=>c.id!==editingId&&c.channel===ch&&c.agent===ag))error='已存在相同的渠道和代理组合';if(error){$('form-error').textContent=error;$('form-error').classList.remove('hidden');return}if(editingId!==null){const c=channels.find(c=>c.id===editingId);Object.assign(c,{channel:ch,agent:ag,note})}else{const id=Math.max(0,...channels.map(c=>c.id))+1;let code;do{code=Math.random().toString(36).slice(2,10)}while(channels.some(c=>c.code===code));const created=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date());channels.push({id,channel:ch,agent:ag,code,enabled:true,created,note})}save();closeModal();renderConfig();refreshCodes();renderStats();toast(editingId!==null?'渠道已更新':'渠道已创建，推广码已自动生成')});
async function copyText(value){try{await navigator.clipboard.writeText(value);toast('推广地址已复制')}catch(e){const field=document.createElement('textarea');field.value=value;field.style.position='fixed';field.style.opacity='0';document.body.appendChild(field);field.select();const ok=document.execCommand('copy');field.remove();toast(ok?'推广地址已复制':'复制失败，请选中推广地址手动复制')}}
$('config-body').addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const c=channels.find(c=>c.id===Number(b.dataset.id));if(!c)return;if(b.dataset.action==='edit')openModal(c.id);if(b.dataset.action==='toggle'){c.enabled=!c.enabled;save();renderConfig();toast('渠道已'+(c.enabled?'启用':'停用'))}if(b.dataset.action==='copy')copyText(url(c))});
$('export').addEventListener('click',()=>{if(!filteredStats.length){toast('暂无可导出的数据');return}const head=['推广码','渠道名','代理名','PV','UV','下载点击人数','首次打开','注册','注册转化率','首充人数','首充率','首充金额','付费人数','付费金额'];const records=filteredStats.map(c=>{const [p,u,d,o,r,f,fa,pa,a]=c.values;return[c.code,c.channel,c.agent,p,u,d,o,r,ratio(r,u),f,ratio(f,r),fa,pa,a]});const cell=v=>'"'+String(v).replace(/^[=+@\-\t\r]/,"'$&").replace(/"/g,'""')+'"';const csv='\uFEFF'+[head,...records].map(row=>row.map(cell).join(',')).join('\r\n');const link=document.createElement('a'),href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));link.href=href;link.download='渠道明细_'+$('start-date').value+'_'+$('end-date').value+'.csv';link.click();setTimeout(()=>URL.revokeObjectURL(href),1000);toast('明细已导出为 CSV')});
refreshCodes();renderStats();renderConfig();
</script>
</body>
</html>
